      additionalProperties: false
      description: The participant's own standing. ADR-020 makes this surface, and only this surface, show Token Burn, the composite weight and both factors, because a participant who is discounted and cannot see that they are discounted has no appeal right in practice. Every field here is recomputable from the entry's own recorded inputs.
      required:
