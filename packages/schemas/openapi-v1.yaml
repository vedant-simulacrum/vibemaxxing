      additionalProperties: false
      required:
        - scope
      properties:
        scope:
          enum:
            - account
            - claims
            - social
            - all
    ExportJob:
      description: >-
        One export request, as the participant sees it. `domains` is required and holds
        one entry per domain in `docs/privacy/DATA_MAP.md`, always all seven, so the
        surface cannot render a package as complete while being silent about a domain
        it left out. `packages/schemas/export-manifest-v1.schema.json` is the manifest
        inside the package and this is its projection; the two carry the same seven
        keys and the same closed exclusion reasons.
      type: object
      additionalProperties: false
      required:
        - export_id
        - state
        - scope
        - requested_at
        - expires_at
        - domains
      properties:
        export_id:
          type: string
          format: uuid
        state:
          enum:
            - requested
            - snapshotting
            - encrypting
            - ready
            - downloaded
            - purged
            - failed
        scope:
          enum:
            - account
            - claims
            - social
            - all
        requested_at:
          type: string
          format: date-time
        snapshot_cutoff_at:
          description: >-
            The instant every included domain was read as of. Absent until the snapshot
            is taken, and never inferred from the request time: a package assembled
            minutes after the request describes the account at the cutoff, not at the
            moment the participant asked.
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        expires_at:
          type: string
          format: date-time
        download_grant:
          description: >-
            The current download grant, absent when none is outstanding. `revoked_at`
            and `expires_at` are separate because they are different endings, and a
            client that shows only one of them cannot tell the participant whether
            their link closed because they closed it.
          type: object
          additionalProperties: false
          required:
            - expires_at
          properties:
            expires_at:
              type: string
              format: date-time
            revoked_at:
              oneOf:
                - type: string
                  format: date-time
                - type: 'null'
        domains:
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: '#/components/schemas/ExportDomainOutcome'
    ExportDomainOutcome:
      description: >-
        What the package holds for one domain. There is no value meaning that the
        producer did not look: a domain that held nothing is `included` with a count of
        zero, and every exclusion names a reason from the closed set the manifest
        schema declares. `derived-not-portable` is the Article 20 split D-108 records,
        and a domain excluded for it is still supplied under Article 15.
      type: object
      additionalProperties: false
      required:
        - data_domain
        - disposition
        - record_count
      properties:
        data_domain:
          enum:
            - account-identity
            - authentication-session
            - device-collection
            - usage-claims-scores
            - social-presence-notifications
            - integrity-moderation-appeals
            - requests-exports-deletion
        disposition:
          enum:
            - included
            - excluded
        record_count:
          type: integer
          minimum: 0
        exclusion_reason:
          enum:
            - derived-not-portable
            - rights-of-others
            - out-of-scope-for-request
    DeletionRequest:
      type: object
      additionalProperties: false
      required:
        - scope
      properties:
        scope:
          enum:
            - server
            - local
            - everything
    DeletionJob:
      type: object
      additionalProperties: false
      required:
        - deletion_job_id
        - state
        - requested_at
        - effective_after
        - blocked_by_legal_hold
        - domain_effects
        - device_outcomes
      properties:
        deletion_job_id:
          type: string
          format: uuid
        state:
          enum:
            - requested
            - recent-auth-verified
            - cooling-off
            - processing
            - awaiting-local-receipt
            - complete
            - cancelled
            - failed
        requested_at:
          type: string
          format: date-time
        effective_after:
          description: >-
            The end of the cooling-off window. Until it passes the request is
            cancellable through cancelDeletion, and `deletion_jobs` refuses to record a
            cancellation after it.
          type: string
          format: date-time
        blocked_by_legal_hold:
          description: >-
            Whether a legal hold is stopping this request from executing. Article 12(4)
            requires the controller to tell the participant when it is not acting on
            their request, and a job that sits in cooling-off indefinitely with no
            explanation is that failure. The field says the request is held; it does not
            say what the hold is, and no field here does.
          type: boolean
        domain_effects:
          description: >-
            One entry per domain in `docs/privacy/DATA_MAP.md`, always all seven. A
            hosted deletion that reported one aggregate outcome could not tell a
            participant that their claims were deleted and their moderation record was
            retained unlinked, which are different answers about different data and are
            both true.
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: '#/components/schemas/DeletionDomainEffect'
        device_outcomes:
          description: >-
            One entry per enrolled device, always. D-076 requires each device to be
            reported independently, and a job whose state is `complete` may still
            carry devices that are `pending`, `unreachable` or `waived`: the hosted
            erasure does not wait for a device that may never return. The array is
            required rather than optional so that a client cannot render a single
            success by omitting it.
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/LocalDeletionOutcome'
    DeletionDomainEffect:
      description: >-
        What the hosted erasure did to one domain. `erasure_action` is the disposition
        registry's own vocabulary rather than a second spelling of it: `delete` removed
        the rows, `key-destroy-retain` kept them and destroyed the key that bound them
        to this person, `retain-unlinked` kept rows whose subject row is gone, and
        `retain-pseudonymous` kept rows that were never bound by a destroyable key.
        There is no state meaning that the domain was not looked at. A domain that held
        nothing is `complete` with an affected count of zero.
      type: object
      additionalProperties: false
      required:
        - data_domain
        - state
        - erasure_action
      properties:
        data_domain:
          enum:
            - account-identity
            - authentication-session
            - device-collection
            - usage-claims-scores
            - social-presence-notifications
            - integrity-moderation-appeals
            - requests-exports-deletion
        state:
          enum:
            - pending
            - executing
            - complete
            - failed
        erasure_action:
          enum:
            - delete
            - key-destroy-retain
            - retain-pseudonymous
            - retain-unlinked
        affected_row_count:
          description: >-
            Present exactly when the effect is complete, and never inferred from its
            absence. A pending domain reports no count because nothing has been counted.
          oneOf:
            - type: integer
              minimum: 0
            - type: 'null'
    LocalDeletionOutcome:
      description: >-
        What one device did with one deletion command. `disposition` is the whole
        answer and is derived from the command row rather than chosen: see
        `local_deletion_commands` in packages/schemas/planning-schema.sql. The
        receipt fields are present exactly when a signed receipt arrived, and
        `residual_risk` is reported rather than resolved — the strongest value it
        offers is `none-observed`, which says observed and not none.
      type: object
      additionalProperties: false
      required:
        - device_id
        - disposition
        - issued_at
        - expires_at
      properties:
        device_id:
          type: string
          format: uuid
        disposition:
          enum:
            - pending
            - complete
            - failed
            - expired
            - unreachable
            - waived
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        receipt_received_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        residual_risk:
          description: >-
            Absent until a receipt arrives, and never inferred from its absence. A
            device that never answers reports no residual risk because the product
            observed nothing, not because there is none.
          enum:
            - filesystem-snapshot-possible
            - backup-copy-possible
            - none-observed
