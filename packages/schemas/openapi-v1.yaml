        kind:
          enum:
            - private
            - organization
            - hacker-house
            - community
        name:
          type: string
          minLength: 1
          maxLength: 100
        visibility:
          enum:
            - public
            - unlisted
            - invite-only
            - private
        membership_revision:
          description: 'The board-scoped counter that advances on every membership or role change. It is the revision the D-386 current-viewer-authorization recheck compares against, which is why it is a counter rather than the membership state it used to be read from: a state detects a change and cannot order two.'
          type: integer
          minimum: 0
        state:
