  /notifications/{notification_id}/read:
    post:
      operationId: markNotificationRead
      description: >-
        Mark one inbox item read. This is the only route to the `notification-read`
        transition, and it exists because the server inbox is the notification
        authority: without it the transition had no actor, and a read could only
        have been inferred from a transport signal, which is exactly what
        `notification_deliveries` is forbidden to carry. A second call on an
        already-read item replays the first response rather than moving the read
        time forward.
      x-authorization: authenticated-account
      x-recent-auth: not-required
      x-idempotency: required-durable-request-hash
      security:
        - sessionCookie: []
          csrfToken: []
        - bearerAuth: []
          deviceProof: []
      responses:
        '200':
          description: Notification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          headers:
            Idempotency-Replayed:
              required: false
              description: Present and true when this response was replayed byte-identically from the idempotency ledger rather than produced by executing the request.
              schema:
                type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: notification_id
          in: path
          required: true
          schema:
            type: string
