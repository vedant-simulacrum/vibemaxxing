components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: 'Native access handle under ADR-015: 256 bits from a cryptographically secure random source, base64url without padding, carrying no encoded claims and stored server-side as a SHA-256 digest. It is a lookup key into a session record, never a self-contained assertion, because per-session revocation takes effect on the next request. It never satisfies an operation on its own; deviceProof accompanies it.'
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-vm_session
      description: Browser access handle. Secure, HttpOnly, SameSite=Lax, Path=/, __Host- prefixed, valid 15 minutes from issue. SameSite=Lax rather than Strict because the OAuth redirect returns by top-level navigation.
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Host-vm_refresh
      description: Browser refresh handle, valid 30 days from issue with the family capped at 90 days absolute from first authentication. It authenticates refreshSession and no other operation.
    csrfToken:
      type: apiKey
      in: header
      name: X-VibeMaxxing-CSRF
      description: Double-submitted token bound to the session record. Every state-changing cookie-authenticated request carries it, because the SameSite attribute is not treated as the whole cross-site defence.
    deviceProof:
      type: apiKey
      in: header
      name: VibeProof-Device-Proof
      description: COSE_Sign1 detached signature from the enrolled Ed25519 device key over the HTTP method, the request path with query, the SHA-256 digest of the body, the session handle digest, a millisecond timestamp and a 128-bit nonce. The server rejects a proof outside a 300-second window, a nonce already seen inside that window, or a signing key that is not the key bound to the session record.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConsolidationCaseId:
      name: consolidation_case_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdentityId:
      name: identity_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Handle:
      name: handle
      in: path
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 30
    OAuthCode:
      name: code
      in: query
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 2048
    OAuthState:
      name: state
      in: query
      required: true
      schema:
        type: string
        pattern: ^[0-9a-f]{64}$
    OAuthIssuer:
      name: iss
      in: query
      required: false
      description: 'The stored provider-capability record is packages/schemas/oauth-provider-registry-v1.json, and rfc9207_iss.capability on the row for this callback''s provider decides what this parameter means. Under `supported` ADR-015 fails closed and an authorization response arriving without an iss is refused, so the parameter is required. Under `unverified`, which is where both launch providers stand because no authorization response from either has been observed, the value is compared when present and never required, and the binding that actually refuses a mix-up is the unique provider-specific callback path. The parameter is declared identically on both callbacks because both rows record the same capability; it was previously declared on one and not the other, which stated a capability difference nothing recorded. The callback value is compared with the immutable transaction issuer and never selects provider configuration.'
      schema:
        type: string
        format: uri
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Client-generated idempotency key. It is unique per (principal, operationId) rather than per account, so the same key presented against a different operation is a different ledger row. See the x-idempotency-contract block at the document root.
    Origin:
      name: Origin
      in: header
      required: false
      schema:
        type: string
        enum:
          - https://vibemaxxing.dev
          - https://www.vibemaxxing.dev
          - http://localhost:3000
      description: 'Browser-set request origin, matched against the exact allowlist in the x-origin-policy block. Required under the cookie-session security alternative and refused when absent there, because every browser sends Origin on POST and DELETE, so its absence means the request did not come from one; not sent under the bearer alternative, because a native client is not a browser and has no origin. OpenAPI cannot make a parameter required under one security alternative and absent under another, so the parameter is declared optional here and the conditional rule is carried by packages/schemas/origin-policy-v1.json, whose state_changing_checks entry for origin-exact-match records missing_header as refuse. A value outside the enum answers 403 with reason code ORIGIN_NOT_ALLOWED. The third entry is present only in the local build and is compiled out of the production artifact rather than configured off.'
    Scope:
      name: scope
      in: path
      required: true
      description: 'The viewer-relative cohort scopes only. `global` is absent because it has its own unauthenticated path, and `board` is absent because a board standing needs the board identifier that /boards/{id}/leaderboard/{period} carries. The audience enum in packages/schemas/ranking-view-v1.schema.json still holds all four, because a stored audience is not a request.'
      schema:
        enum:
          - friends
          - rivals
    Period:
      name: period
      in: path
      required: true
      schema:
        enum:
          - daily
          - weekly
          - monthly
          - seasonal
          - yearly
          - lifetime
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 2048
      description: 'Opaque forward cursor returned as the cursor field of the previous page. A client never constructs one and never parses one. Its record shape is packages/schemas/ranking-cursor-v1.schema.json and the five refusals are evaluated in the fixed order that file declares: a cursor the server did not issue, an expired one, one issued to a different principal, one anchored in a generation that is no longer active, and one whose authorization revision the viewer has since moved past. Each is a case in conformance/planning/ranking-cursor-vectors-v1.json. Until PF-022 this sentence named three refusals and no field in the repository held anything either of them could compare.'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Page size. The default is 50 and the maximum is 200, which is the same bound the items array of every page schema carries.
    RankingView:
      name: ranking_view_id
      in: query
      required: false
      schema:
        type: string
        pattern: ^[0-9a-f]{64}$
  responses:
    Problem:
      description: Stable typed problem envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Preflight:
      description: 'CORS preflight answer. It is produced by the edge before routing and never by an operation, which is why this component is referenced by the x-origin-policy block rather than by an options entry on every path. An allowlisted origin receives 204 with the six headers below. An origin that is not on the list receives 204 with no Access-Control-* header at all and no body, and the browser blocks the request itself: an error body would tell a probing page whether an origin is known. There is no third response, because a preflight that is refused loudly is a preflight that answers a question the caller was not entitled to ask.'
      headers:
        Access-Control-Allow-Origin:
          required: false
          description: The exact request origin when it is on the allowlist, never a wildcard and never reflected without a match. Absent entirely for an origin that is not on the list.
          schema:
            type: string
            enum:
              - https://vibemaxxing.dev
              - https://www.vibemaxxing.dev
              - http://localhost:3000
        Access-Control-Allow-Methods:
          required: false
          schema:
            type: string
            const: GET, POST, DELETE
        Access-Control-Allow-Headers:
          required: false
          schema:
            type: string
            const: Content-Type, Idempotency-Key, If-Match
        Access-Control-Expose-Headers:
          required: false
          schema:
            type: string
            const: Retry-After, RateLimit, RateLimit-Policy, X-Request-Id
        Access-Control-Allow-Credentials:
          required: false
          schema:
            type: string
            const: 'true'
        Access-Control-Max-Age:
          required: false
          description: Ten minutes is long enough to remove the preflight from an interactive session and short enough that revoking an origin takes effect within a coffee break.
          schema:
            type: integer
            const: 600
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: The request could not be parsed or a parameter failed its declared shape
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: No usable session credential was presented, or the one presented is expired, revoked, replayed, or unaccompanied by a valid device proof
      headers:
        WWW-Authenticate:
          required: true
          schema:
            type: string
            maxLength: 512
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The principal is authenticated and is not permitted to perform this operation on this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No resource is addressed by this path for this principal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request contradicts the current state of the addressed aggregate or of its idempotency ledger row
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: The idempotency record for this key aged past its retention window and its recorded response no longer exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: The request body media type is not one this operation accepts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableContent:
      description: The request parsed and was rejected on its meaning rather than its shape
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    UpgradeRequired:
      description: 'The calling client is below the moving version floor for this interface and is refused rather than silently degraded, which is what D-570 chose: a refusal the participant can act on beats a client that appears to work and quietly stops counting. The floor itself is published by getCompatibility, which is public reference data, so a refused client can read what it must reach without a credential it may no longer be able to obtain.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - reason_code
        - retryable
        - details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          maxLength: 120
        status:
          type: integer
          minimum: 400
          maximum: 599
        reason_code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{2,63}$
        retryable:
          type: boolean
        details:
          type: array
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required:
              - field
              - issue
            properties:
              field:
                type: string
                maxLength: 120
              issue:
                enum:
                  - invalid
                  - missing
                  - conflict
                  - expired
                  - forbidden
                  - too_large
    TransitionReceipt:
      type: object
      additionalProperties: false
      required:
        - transition_id
        - state
        - revision
        - committed_at
      properties:
        transition_id:
          type: string
          format: uuid
        state:
          type: string
          minLength: 1
          maxLength: 64
        revision:
          type: integer
          minimum: 1
        committed_at:
          type: string
          format: date-time
    InviteRedemptionRequest:
      type: object
      additionalProperties: false
      required:
        - invite_code
      properties:
        invite_code:
          type: string
          minLength: 25
          maxLength: 29
          pattern: ^[0-9A-Za-z]{5}(?:-?[0-9A-Za-z]{5}){4}$
          description: 'A private-beta invite code: 125 bits from a cryptographically secure random source, encoded in Crockford base 32 as 25 characters and displayed in five groups of five. The server normalises before hashing — uppercase, hyphens and whitespace removed, and the Crockford confusable folding that maps I and L to 1 and O to 0 — so a transcription error in those characters is accepted rather than refused. The generating alphabet excludes I, L, O and U, so the folding costs no entropy.'
    InviteRedemption:
      type: object
      additionalProperties: false
      required:
        - redeemed_at
        - revision
      properties:
        redeemed_at:
          type: string
          format: date-time
          description: When the redemption row committed. A byte-identical replay under the same idempotency key returns the original instant rather than the replay instant.
        revision:
          type: integer
          minimum: 1
          description: Revision of the invite-code aggregate after the redemption committed.
      description: The response deliberately carries no invite identifier, no issuer identifier and no invite-code lifecycle state. Under D-284 the issuer is not disclosed to the invitee, so nothing here names the person who issued the code.
    OAuthStartRequest:
      type: object
      additionalProperties: false
      required:
        - intended_action
      properties:
        intended_action:
          description: 'What the transaction is for. The two values are the CHECK literals on oauth_transactions.intended_action and are kebab-case like every other vocabulary in this repository; they were snake_case here and unconstrained in the DDL, so the API held a vocabulary the persistence owner did not and neither spelling could be compared with the other.'
          enum:
            - sign-in
            - link-identity
    OAuthStart:
      type: object
      additionalProperties: false
      required:
        - transaction_id
        - authorization_url
        - expires_at
      properties:
        transaction_id:
          type: string
          format: uuid
        authorization_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    OAuthCompletion:
      description: 'What a callback returns, and where the two intended actions stop being the same operation. A sign-in callback consumes the transaction and mints browser access, so it reaches `consumed` and carries both an account and a session. A link callback does neither: it verifies the stored redirect, state, PKCE and lifetime, moves the transaction to `callback-received`, and stops. The link itself is performed by linkIdentity, which is authenticated, CSRF-protected, recent-auth gated and idempotent — none of which a public callback can be. The previous shape required account_id and session_id unconditionally, so the contract said a link callback mints a session, which is the thing oauth_transactions now refuses at the constraint level.'
      type: object
      additionalProperties: false
      required:
        - transaction_id
        - intended_action
        - state
      properties:
        transaction_id:
          type: string
          format: uuid
        intended_action:
          enum:
            - sign-in
            - link-identity
        account_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        state:
          enum:
            - callback-received
            - consumed
      allOf:
        - if:
            properties:
              intended_action:
                const: sign-in
            required:
              - intended_action
          then:
            required:
              - account_id
              - session_id
            properties:
              state:
                const: consumed
        - if:
            properties:
              intended_action:
                const: link-identity
            required:
              - intended_action
          then:
            not:
              required:
                - session_id
            properties:
              state:
                const: callback-received
    DeviceAuthStartRequest:
      type: object
      additionalProperties: false
      required:
        - installation_id
        - device_name
        - profile_id
      properties:
        installation_id:
          type: string
          format: uuid
        device_name:
          type: string
          minLength: 1
          maxLength: 80
        profile_id:
          type: string
          pattern: ^[a-z0-9]+(?:[.-][a-z0-9]+)*$
          description: Must resolve to a registered limited-input or headless interactive profile. Desktop and CI profiles are rejected.
    DeviceAuthorization:
      type: object
      additionalProperties: false
      required:
        - device_code
        - user_code
        - verification_uri
        - expires_at
        - poll_interval_seconds
      properties:
        device_code:
          type: string
          pattern: ^[0-9a-f]{64}$
        user_code:
          type: string
          pattern: ^[A-Z0-9]{8}$
        verification_uri:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
        poll_interval_seconds:
          type: integer
          minimum: 5
          maximum: 60
    DeviceAuthPollRequest:
      type: object
      additionalProperties: false
      required:
        - device_code
      properties:
        device_code:
          type: string
          pattern: ^[0-9a-f]{64}$
    DeviceAuthorizationStatus:
      type: object
      additionalProperties: false
      required:
        - state
        - retry_after_seconds
      properties:
        state:
          enum:
            - pending
            - approved
            - denied
            - expired
            - consumed
        retry_after_seconds:
          type: integer
          minimum: 0
          maximum: 60
    DeviceAuthExchangeRequest:
      type: object
      additionalProperties: false
      required:
        - device_code
        - device_proof
      properties:
        device_code:
          type: string
          pattern: ^[0-9a-f]{64}$
        device_proof:
          type: string
          minLength: 40
          maxLength: 4096
    NativeSession:
      type: object
      additionalProperties: false
      required:
        - session_id
        - token_type
        - access_token
        - expires_at
        - device_key_thumbprint
      properties:
        session_id:
          type: string
          format: uuid
        token_type:
          enum:
            - Device-Bound
        access_token:
          type: string
          minLength: 32
          maxLength: 4096
        expires_at:
          type: string
          format: date-time
        device_key_thumbprint:
          type: string
          pattern: ^[0-9a-f]{64}$
    Session:
      type: object
      additionalProperties: false
      required:
        - session_id
        - kind
        - state
        - created_at
        - expires_at
        - current
        - family_generation
        - family_reason_code
      properties:
        session_id:
          type: string
          format: uuid
        kind:
          enum:
            - web
            - native
        state:
          enum:
            - active
            - revoked
            - expired
            - rotated
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        current:
          type: boolean
        family_reason_code:
          type:
            - string
            - 'null'
          pattern: ^[A-Z][A-Z0-9_]{2,63}$
          description: The reason code from packages/schemas/reason-codes-v1.json that ended this session family, or null while the family is live. WEB_SESSION_REPLAY_DETECTED, NATIVE_SESSION_REPLAY_DETECTED and NATIVE_SESSION_DEVICE_REVOKED carry the family outcomes that the member-level state enum does not name.
        family_generation:
          type: integer
          minimum: 1
          description: Generation counter of the session family, incremented by every rotation.
    SessionPage:
      type: object
      additionalProperties: false
      required:
        - items
        - cursor
        - snapshot_id
        - revision
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Session'
        cursor:
          type:
            - string
            - 'null'
          maxLength: 2048
        snapshot_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 0
    Identity:
      type: object
      additionalProperties: false
      required:
        - identity_id
        - provider
        - subject
        - state
        - linked_at
      properties:
        identity_id:
          type: string
          format: uuid
        provider:
          enum:
            - github
            - x
        subject:
          type: string
          pattern: ^[0-9a-f]{64}$
        state:
          description: 'The six linked-identity states a client is shown. `candidate` and `superseded` are omitted and are declared internal in the binding table of docs/architecture/AUTHORITATIVE_STATE_AND_PLATFORM_CONTRACT.md: a candidate is a link still in flight and has no confirmed binding to report, and a superseded row is history its successor already represents.'
          enum:
            - linked
            - unlink-pending
            - lost
            - compromised
            - recovery-pending
            - unlinked
        linked_at:
          type: string
          format: date-time
    IdentityPage:
      type: object
      additionalProperties: false
      required:
        - items
        - cursor
        - snapshot_id
        - revision
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Identity'
        cursor:
          type:
            - string
            - 'null'
          maxLength: 2048
        snapshot_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 0
    IdentityMutationRequest:
      description: 'The link request. It names an OAuth transaction and nothing else. It previously carried a bare `authorization_code`, which made linkIdentity a second identity-mutating path that referenced no transaction: nothing bound the redirect, the state, the PKCE verifier, the provider revision or the lifetime, so every control the transaction exists to apply was optional in practice. The named transaction must be one this account started with intended_action link-identity and must stand at callback-received; consuming it is what links the provider subject, and it can be consumed once.'
      type: object
      additionalProperties: false
      required:
        - provider
        - oauth_transaction_id
      properties:
        provider:
          enum:
            - github
            - x
        oauth_transaction_id:
          type: string
          format: uuid
    ConsolidationPlanView:
      description: 'What the participant is shown before confirming. It carries counts and per-domain outcomes and no combined figure: D-070 forbids adding two stored account totals, so there is no field here for one, and packages/schemas/consolidation-plan-v1.schema.json is the record this view projects. The eight domain keys are the ones a merge must define ownership of, and all eight are required, so a plan cannot be presented while silent about the absorbed account''s devices, blocks, boards, moderation state, exports or pending deletion.'
      type: object
      additionalProperties: false
      required:
        - consolidation_case_id
        - plan_digest
        - surviving_ranked_identity_id
        - absorbed_ranked_identity_id
        - absorbed_contribution_count
        - excluded_contribution_count
        - affected_period_count
        - domain_dispositions
        - expires_at
        - revision
      properties:
        consolidation_case_id:
          type: string
          format: uuid
        plan_digest:
          description: SHA-256 over the canonical consolidation plan record. The confirmation names it, so a plan cannot be substituted between being read and being confirmed.
          type: string
          pattern: ^[0-9a-f]{64}$
        surviving_ranked_identity_id:
          type: string
          format: uuid
        absorbed_ranked_identity_id:
          type: string
          format: uuid
        absorbed_contribution_count:
          type: integer
          minimum: 0
        excluded_contribution_count:
          type: integer
          minimum: 0
        affected_period_count:
          type: integer
          minimum: 0
        domain_dispositions:
          type: array
          minItems: 8
          maxItems: 8
          items:
            $ref: '#/components/schemas/ConsolidationDomainDisposition'
        expires_at:
          type: string
          format: date-time
        revision:
          type: integer
          minimum: 1
    ConsolidationDomainDisposition:
      type: object
      additionalProperties: false
      required:
        - domain
        - disposition
        - affected_count
      properties:
        domain:
          enum:
            - identities
            - devices
            - claims
            - social
            - boards
            - moderation
            - exports
            - deletions
        disposition:
          enum:
            - transferred
            - retained
            - excluded
            - recomputed
        affected_count:
          description: A count of rows, never a quantity. No property in this document holds a figure derived from two accounts' token burn.
          type: integer
          minimum: 0
    ConsolidationConfirmationRequest:
      type: object
      additionalProperties: false
      required:
        - plan_digest
      properties:
        plan_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
    ProviderAccessReportRequest:
      type: object
      additionalProperties: false
      required:
        - report
      properties:
        report:
          description: 'Which fact the participant is reporting. `lost` means the provider account is no longer reachable; `compromised` means someone else controls it. They are separate values because they lead to different notices and because a compromise, unlike a loss, means the provider identity can no longer be trusted to authorize anything.'
          enum:
            - lost
            - compromised
    IdentityUnlinkRequest:
      description: 'The unlink request. It names the linked identity to remove, because there is nothing to authorize against a provider: unlinking is a change to this account''s own rows. It shared IdentityMutationRequest with linkIdentity, which meant the contract required an authorization code to remove a link — including the case where the provider account is exactly what the participant has lost. Unlinking the last authentication method an account holds is refused; docs/security/AUTHENTICATION_AND_RECOVERY.md owns that invariant and the linked-identity machine carries it as the guard on identity-unlink-request.'
      type: object
      additionalProperties: false
      required:
        - identity_id
      properties:
        identity_id:
          type: string
          format: uuid
    Device:
      type: object
      additionalProperties: false
      required:
        - device_id
        - lineage_id
        - platform_profile_id
        - state
        - key_id
      properties:
        device_id:
          type: string
          format: uuid
        lineage_id:
          type: string
          format: uuid
        platform_profile_id:
          type: string
          minLength: 1
          maxLength: 256
        state:
          enum:
            - pending
            - active
            - quarantined
            - revoked
            - deleted
        key_id:
          type: string
          pattern: ^[0-9a-f]{64}$
    DevicePage:
      type: object
      additionalProperties: false
      required:
        - items
        - cursor
        - snapshot_id
        - revision
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Device'
        cursor:
          type:
            - string
            - 'null'
          maxLength: 2048
        snapshot_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 0
    DeviceEnrollRequest:
      type: object
      additionalProperties: false
      required:
        - installation_id
        - lineage_id
        - platform_profile_id
        - public_key
      properties:
        installation_id:
          type: string
          format: uuid
        lineage_id:
          type: string
          format: uuid
        platform_profile_id:
          type: string
          minLength: 1
          maxLength: 256
        public_key:
          type: string
          contentEncoding: base64
          maxLength: 128
    DeviceKeyRotationRequest:
      type: object
      additionalProperties: false
      required:
        - previous_key_id
        - new_public_key
        - continuity_signature
      properties:
        previous_key_id:
          type: string
          pattern: ^[0-9a-f]{64}$
        new_public_key:
          type: string
          contentEncoding: base64
          maxLength: 128
        continuity_signature:
          type: string
          contentEncoding: base64
          maxLength: 128
    ClaimChallengeRequest:
      description: >-
        The device asks for a challenge. It states which device row is asking and
        nothing else: every field of the challenge is server-assigned, and a client
        that could propose the expected sequence, head or checkpoint could choose
        the state its own batch is verified against. `batch_commitment` was
        required here and is removed under D-626 — it asked the client to
        pre-commit to a batch digest before the challenge existed, while every
        claim in that batch signs the challenge nonce, so the digest could not be
        computed until after the value that was supposed to bind it.
      type: object
      additionalProperties: false
      required:
        - device_id
      properties:
        device_id:
          type: string
          format: uuid
    ClaimChallenge:
      description: >-
        The JSON projection of `challenge-v1` in
        `packages/schemas/vibeproof-claim-v1.cddl`, field for field, and the row
        `claim_challenges` stores. `scripts/repository/validate_batch_challenge_binding.py`
        holds the three-way table and fails when any one of the three carries a
        field the other two do not.
      type: object
      additionalProperties: false
      required:
        - challenge_id
        - account_pseudonym
        - lineage_id
        - nonce
        - expected_next_sequence
        - expected_local_commitment_head
        - expected_checkpoint_receipt_id
        - issued_at
        - expires_at
        - max_batch_claims
        - max_encoded_bytes
      properties:
        challenge_id:
          type: string
          format: uuid
        account_pseudonym:
          type: string
          pattern: ^[0-9a-f]{64}$
        lineage_id:
          type: string
          format: uuid
        nonce:
          type: string
          contentEncoding: base64
          minLength: 44
          maxLength: 44
        expected_next_sequence:
          type: integer
          minimum: 0
        expected_local_commitment_head:
          type: string
          pattern: ^[0-9a-f]{64}$
        expected_checkpoint_receipt_id:
          type:
            - string
            - 'null'
          format: uuid
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        max_batch_claims:
          type: integer
          minimum: 1
          maximum: 256
        max_encoded_bytes:
          type: integer
          minimum: 1
    ClaimRejection:
      type: object
      additionalProperties: false
      required:
        - claim_index
        - reason_code
        - retryable
      properties:
        claim_index:
          type: integer
          minimum: 0
          maximum: 255
        reason_code:
          type: string
          minLength: 1
          maxLength: 64
        retryable:
          type: boolean
    CheckpointReceipt:
      description: >-
        The JSON projection of `checkpoint-receipt-v1` in
        `packages/schemas/vibeproof-claim-v1.cddl`, field for field, and the row
        `checkpoint_receipts` stores. Label 0 is the protocol major and is
        published by neither this schema nor the DDL: the API is versioned by
        path and the DDL by migration.
        `scripts/repository/validate_checkpoint_receipt_binding.py` holds the
        three-way table and fails when any one of the three carries a field the
        other two do not. Before PF-073 this component did not exist and
        `ClaimBatchResult.checkpoint_receipt` was an opaque base64 blob, so the
        eleven fields the server signs reached the client with no published
        meaning and a client could read none of them without a CBOR decoder and
        a copy of the CDDL. The bytes are still published beside this, as
        `checkpoint_receipt_cose`: a projection is what a client reads and the
        envelope is what it verifies, and neither substitutes for the other.
      type: object
      additionalProperties: false
      required:
        - checkpoint_receipt_id
        - account_pseudonym
        - lineage_id
        - accepted_through_claim_sequence
        - accepted_local_commitment_head
        - last_accepted_claim_sha256
        - server_receipt_sequence
        - verifier_policy_id
        - issued_at
        - expires_at
        - server_signing_key_id
      properties:
        checkpoint_receipt_id:
          type: string
          format: uuid
        account_pseudonym:
          type: string
          pattern: ^[0-9a-f]{64}$
        lineage_id:
          type: string
          format: uuid
        accepted_through_claim_sequence:
          type: integer
          minimum: 0
        accepted_local_commitment_head:
          type: string
          pattern: ^[0-9a-f]{64}$
        last_accepted_claim_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        server_receipt_sequence:
          description: >-
            The monotonic receipt counter
            `docs/architecture/VIBEPROOF_V1_PROTOCOL.md` names as server state.
            It is not the claim sequence: one accepted batch advances
            `accepted_through_claim_sequence` by up to 256 and this by exactly
            one.
          type: integer
          minimum: 0
        verifier_policy_id:
          type: string
          minLength: 1
          maxLength: 64
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        server_signing_key_id:
          type: string
          format: uuid
    ClaimBatchResult:
      description: >-
        ADR-007 prohibits partial batch acceptance and this schema admitted it:
        `accepted_claim_ids` and `rejections` were both required with nothing
        constraining either to be empty, so "batch accepted, claims 3 and 7
        rejected" was a valid instance of the published contract. The `oneOf`
        below is the prohibition as a schema rather than as prose in three
        documents: an accepted batch carries no rejections and a rejected batch
        carries no accepted claims and no receipt. `atomic-batch-result-v1` in
        `packages/schemas/vibeproof-claim-v1.cddl` carries the same rule on the
        wire, where the six batch outcomes it encodes map onto these two states.
      type: object
      additionalProperties: false
      oneOf:
        - title: accepted
          properties:
            state:
              const: accepted
            rejections:
              maxItems: 0
          required:
            - state
        - title: rejected
          properties:
            state:
              const: rejected
            accepted_claim_ids:
              maxItems: 0
            checkpoint_receipt:
              type: 'null'
            checkpoint_receipt_cose:
              type: 'null'
          required:
            - state
      required:
        - batch_id
        - state
        - accepted_claim_ids
        - rejections
        - checkpoint_receipt
        - checkpoint_receipt_cose
      properties:
        batch_id:
          type: string
          format: uuid
        state:
          enum:
            - accepted
            - rejected
        accepted_claim_ids:
          type: array
          maxItems: 256
          items:
            type: string
            format: uuid
        rejections:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/ClaimRejection'
        checkpoint_receipt:
          description: >-
            The receipt as fields. Null on a rejected batch, because a receipt
            acknowledges an accepted head and a rejected batch advanced none.
          oneOf:
            - $ref: '#/components/schemas/CheckpointReceipt'
            - type: 'null'
        checkpoint_receipt_cose:
          description: >-
            The same receipt as the `cose-sign1-receipt-v1` envelope the server
            signed. The client needs both: these bytes are what it verifies
            against `server_signing_key_id`, and `checkpoint_receipt` is what it
            reads. Publishing only the bytes, which is what this schema did
            before PF-073, made every field unreadable without a CDDL; publishing
            only the projection would make the signature unverifiable.
          type:
            - string
            - 'null'
          contentEncoding: base64
          maxLength: 4096
    ClaimRecord:
      type: object
      additionalProperties: false
      required:
        - claim_id
        - device_id
        - sequence
        - state
        - payload_digest
        - appraisal_id
        - accepted_at
        - evidence_class
      properties:
        claim_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 0
        state:
          enum:
            - accepted
            - corrected
            - retracted
            - quarantined
        payload_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
        appraisal_id:
          type: string
          format: uuid
          description: >-
            The verifier appraisal that decided this claim. It is retrieved
            through operationId `getAppraisal`, which answers with
            `AppraisalSummary` — the self-only projection of
            `packages/schemas/appraisal-result-v1.schema.json`. The identifier
            is classified `self` in
            `packages/schemas/disclosure-projection-v1.json` because the
            appraisal it names is integrity-private, so it never reaches a
            viewer who is not the submitter of this claim.
        accepted_at:
          type: string
          format: date-time
        evidence_class:
          enum:
            - hardened
            - standard
            - imported
          description: The awarded public evidence state from packages/schemas/evidence-profile-policy-v1.json. The server verifier assigns it; a client field requesting one is ignored under the policy's client-requested-public-state rule. Under ADR-020 the class is a weight on Credited Token Burn rather than a badge, and under D-100 no provider offers an individual-account attestation path, so the class assesses the quality of a self-report and is not a confirmation from any provider.
    AppraisalSummary:
      type: object
      additionalProperties: false
      description: >-
        The self-only projection of `VerifierAppraisalResult`
        (`packages/schemas/appraisal-result-v1.schema.json`). It carries every
        field of that record except `schema_version`, which is a wire concern of
        the stored record rather than of this document, and except the two the
        subject is not told: `evaluated.anomaly_disposition` under D-381 and
        `policy.implementation_sha256` as data that is not the participant's
        own. The record's `public_state` crosses the boundary as
        `evidence_class`, which is the one evidence vocabulary D-143 admits to
        the API.
      required:
        - appraisal_id
        - claim_id
        - canonical_claim_sha256
        - evidence_bundle_sha256
        - policy
        - authority
        - client_influence
        - attestation
        - acceptance_outcome
        - dimensions
        - evaluated
        - awarded_profile_id
        - evidence_class
        - ranking_eligibility
        - reason_codes
        - validity
        - supersession
      properties:
        appraisal_id:
          type: string
          format: uuid
        claim_id:
          type: string
          format: uuid
        canonical_claim_sha256:
          description: The digest of the exact signed claim bytes this appraisal evaluated.
          type: string
          pattern: ^[0-9a-f]{64}$
        evidence_bundle_sha256:
          description: Null when the device retained no bundle, which is an input to the capture dimension rather than a neutral absence.
          type:
            - string
            - 'null'
          pattern: ^[0-9a-f]{64}$
        policy:
          type: object
          additionalProperties: false
          description: 'The published policy bundle the appraisal was decided under. `implementation_sha256` is withheld: the verifier build digest is not the participant''s personal data and no appeal needs it.'
          required:
            - policy_bundle_id
            - content_sha256
          properties:
            policy_bundle_id:
              type: string
              maxLength: 128
              pattern: ^[a-z0-9]+(?:[.-][a-z0-9]+)*$
            content_sha256:
              type: string
              pattern: ^[0-9a-f]{64}$
        authority:
          description: Public evidence status is assigned by the server verifier and never selected by the client.
          enum:
            - server-verifier
        client_influence:
          enum:
            - none
        attestation:
          type: object
          additionalProperties: false
          description: D-100. The appraisal assesses how good a self-report is. No surface may present it as a confirmation from a provider, because no provider offers an individual-account attestation path.
          required:
            - class
            - basis
            - assesses
          properties:
            class:
              enum:
                - none
            basis:
              enum:
                - self-reported-at-source
            assesses:
              enum:
                - self-report-quality
        acceptance_outcome:
          enum:
            - accepted
            - accepted-with-downgrade
            - accepted-private-analytics
            - idempotent-replay
            - quarantined
            - rejected
            - superseded
            - retracted
        dimensions:
          type: object
          additionalProperties: false
          description: The seven independent dimensions. A stronger value in one never compensates for a failed mandatory requirement in another. The subject already reads the derived weights on `SelfRankEntry`, so disclosing the dimensions to the subject discloses strictly less than what they hold already.
          required:
            - source_class
            - capture_class
            - accounting_class
            - device_key_class
            - continuity_class
            - environment_class
            - freshness_class
          properties:
            source_class:
              enum:
                - E1-S
                - E1-R
                - E2
                - E3
                - E4
                - E5
            capture_class:
              enum:
                - certified-structured
                - certified-gateway
                - certified-reconstruction
                - uncertified
            accounting_class:
              enum:
                - authoritative-profile
                - exact-reconstruction
                - approximate
                - contradictory
            device_key_class:
              enum:
                - K1
                - K2
                - K3
                - K4
                - K5
                - KU
            continuity_class:
              enum:
                - C0
                - C1
                - C2
                - C3
                - C4
            environment_class:
              enum:
                - A0
                - A1
                - A2
                - A3
                - A4
            freshness_class:
              enum:
                - anchored
                - bounded-delayed
                - unbounded
                - contradictory
        evaluated:
          type: object
          additionalProperties: false
          description: 'The rule set the dimensions were read under, which is what an appeal argues against. `anomaly_disposition` is withheld: its `under-review` and `shadow-only` values are the statement that an integrity case is open, and D-381 keeps that from the participant.'
          required:
            - certification_bundle_sha256
            - certification_state
            - deterministic_rule_bundle_id
            - accounting_profile_id
            - observer_equivalence_rule_id
          properties:
            certification_bundle_sha256:
              type:
                - string
                - 'null'
              pattern: ^[0-9a-f]{64}$
            certification_state:
              description: 'The lifecycle state of the tuple this claim was appraised under, from the `source-certification` machine. The digest above says which certification was read; this says whether it was still active when it was read, and a claim capped at private analytics because its tuple was suspended or expired is entitled to know that rather than to infer it. `uncertified` covers a capture bound to no certification at all.'
              enum:
                - uncertified
                - candidate
                - testing
                - active
                - degraded
                - suspended
                - expired
                - superseded
                - retired
            deterministic_rule_bundle_id:
              type: string
              maxLength: 128
              pattern: ^[a-z0-9]+(?:[.-][a-z0-9]+)*$
            accounting_profile_id:
              type: string
              maxLength: 128
              pattern: ^[a-z0-9]+(?:[.-][a-z0-9]+)*$
            observer_equivalence_rule_id:
              type: string
              maxLength: 128
              pattern: ^[a-z0-9]+(?:[.-][a-z0-9]+)*$
        awarded_profile_id:
          type:
            - string
            - 'null'
          enum:
            - hardened-source-bound-v1
            - standard-competitive-v1
            - imported-v1
            - null
        evidence_class:
          description: The record's `public_state` under the one API vocabulary D-143 fixes. Null when no profile was awarded. A client never selects it.
          type:
            - string
            - 'null'
          enum:
            - hardened
            - standard
            - imported
            - null
        ranking_eligibility:
          enum:
            - competitive
            - competitive-pending-finalization
            - private-analytics
            - quarantined
            - excluded
            - retracted
        reason_codes:
          description: Codes from `packages/schemas/reason-codes-v1.json`. Their `appealability` is what tells the subject whether this outcome can be appealed.
          type: array
          uniqueItems: true
          maxItems: 64
          items:
            type: string
            maxLength: 128
            pattern: ^[a-z0-9]+(?:[.-][a-z0-9]+)*$
        validity:
          type: object
          additionalProperties: false
          required:
            - effective_from
            - effective_until
          properties:
            effective_from:
              type: string
              format: date-time
            effective_until:
              type:
                - string
                - 'null'
              format: date-time
        supersession:
          type: object
          additionalProperties: false
          description: Appraisals are immutable and corrections are append-only, so a re-evaluation is a new appraisal that supersedes this one rather than an edit to it.
          required:
            - supersedes_appraisal_id
            - superseded_by_appraisal_id
            - re_evaluation_trigger
          properties:
            supersedes_appraisal_id:
              type:
                - string
                - 'null'
              format: uuid
            superseded_by_appraisal_id:
              type:
                - string
                - 'null'
              format: uuid
            re_evaluation_trigger:
              type:
                - string
                - 'null'
              enum:
                - policy-revision
                - implementation-revision
                - certification-change
                - correction-record
                - appeal-decision
                - operator-review
                - null
    RankEntry:
      type: object
      additionalProperties: false
      description: 'One standing on a leaderboard page. The field named score was removed under D-144: ADR-020 bans it as a name because it is the word that lets the claimed and credited figures merge.'
      required:
        - account_id
        - handle
        - display_name
        - avatar_id
        - evidence_class
        - credited_token_burn
        - position
        - previous_position
        - rank_movement
        - availability
        - ranking_view_id
        - snapshot_id
        - revision
      properties:
        account_id:
          type: string
          format: uuid
        handle:
          type: string
          minLength: 3
          maxLength: 30
        display_name:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 60
          description: Participant-chosen display name, distinct from the immutable handle. Null when the participant set none, in which case a client renders the handle.
        avatar_id:
          type: integer
          minimum: 0
          maximum: 8
          description: Index into the repository-owned avatar library in assets/ui/fixtures. The product accepts no uploaded image, so no participant-supplied media crosses the boundary.
        evidence_class:
          enum:
            - hardened
            - standard
          description: 'The awarded public evidence state from packages/schemas/evidence-profile-policy-v1.json. The server verifier assigns it; a client field requesting one is ignored under the policy''s client-requested-public-state rule. Under ADR-020 the class is a weight on Credited Token Burn rather than a badge, and under D-100 no provider offers an individual-account attestation path, so the class assesses the quality of a self-report and is not a confirmation from any provider. `imported` is absent on a ranking entry and only on a ranking entry: historical imports never enter active competition, so an imported record produces no entry. `ranking_entries.evidence_class` and ranking-generation-v1.schema.json both refused it already, which left this schema as the one artifact in the repository saying an import could be ranked. A profile still carries it, because a participant whose only records are imports has an evidence class and no standing.'
        credited_token_burn:
          type: integer
          minimum: 0
          description: 'Credited Token Burn: Token Burn multiplied by the server-assigned confidence weight, floored, integer throughout. This is the quantity rank() orders. Token Burn itself is absent from every public surface under D-144, because publishing both quantities lets any observer recover the weight by division and, since the evidence class is already public, recover the trust factor and therefore a sanction D-084 keeps private.'
        position:
          type: integer
          minimum: 1
        previous_position:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Position in the superseded generation of this ranking view, or null when this entry is new to the board.
        rank_movement:
          type: integer
          minimum: -1000000
          maximum: 1000000
          description: Positions gained since the previous generation of this ranking view. Negative is a fall, zero is unchanged.
        availability:
          enum:
            - online
            - idle
            - offline
          description: Server-derived from qualifying device activity. A participant whose presence visibility excludes this viewer reads offline, which is the same value an inactive participant reads.
        top_model_alias:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 64
        ranking_view_id:
          type: string
          pattern: ^[0-9a-f]{64}$
        generation:
          type: integer
          minimum: 0
          description: 'The sealed generation this entry belongs to. Every entry key in planning-schema.sql includes it — `ranking_entries` is keyed `(ranking_view_id, generation, position)` and unique on `(ranking_view_id, generation, erasure_domain_id)` — and the API projection of an entry did not carry it, so a client holding a position could not say which generation the position indexed and two generations of one view rendered as one series.'
        snapshot_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 0
    LeaderboardPage:
      type: object
      additionalProperties: false
      required:
        - items
