      description: >-
        `docs/privacy/DATA_MAP.md` states, as part of the Article 30 record, that the
        deletion cooling-off window is seven days and is cancellable within it. The
        `server-deletion` machine had no `cancelled` state and no transition out of
        `cooling-off` other than forward, and no operation existed, so the window was a
        delay rather than a reversal and the record described behaviour nothing could
        perform. This is that transition's only route.
        It is refused outside the window. `deletion_jobs` will not record a cancellation
        whose time is not before `effective_after`, so a request that has begun
        executing cannot be pulled back by a late call — the rows it has already deleted
        are gone, and a cancellation that pretended otherwise would be a worse answer
        than a refusal.
