        revision:
          type: integer
          minimum: 0
    Notification:
      description: >-
        One inbox item. It carries references and no rendered sentence: there is no
        title, body or summary, because a stored sentence would freeze a handle, a
        figure and an authorization decision at write time. The surface renders from
        current state at read time, which is what lets a rename be correct, a block
        take effect, and a retraction reach a participant who has not looked yet.
        The state vocabulary is exactly the states that reached the inbox; the four
        worker states before delivery are internal under D-420 and no client is ever
        shown one.
      type: object
      additionalProperties: false
      required:
        - notification_id
        - type
        - state
        - created_at
        - delivered_at
        - group_count
        - actor_account_id
        - scope_id
      properties:
        notification_id:
          type: string
          format: uuid
        type:
          enum:
            - friend_request
            - board_invitation
            - rank_overtake
            - moderation
            - appeal
            - security
            - compatibility
            - release
        state:
          enum:
            - delivered
            - read
            - retracted
            - expired
        created_at:
          type: string
          format: date-time
        delivered_at:
          description: >-
            When the item reached the server inbox. It is the only delivery time a
            client sees, and no transport can set it: a push acceptance or a device
            acknowledgement is a hint about this item, never evidence that it was
            delivered or read.
          type: string
          format: date-time
        group_count:
          description: >-
            How many source events this item stands for. One item with a count of
            twelve, never twelve items.
          type: integer
          minimum: 1
        read_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        retracted_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        retraction_reason_code:
          description: >-
            Why the item was withdrawn, from packages/schemas/reason-codes-v1.json.
            A retracted item stays in the inbox and stays addressable. Deleting it
            would leave the participant holding a fact the product has withdrawn and
            no way to learn that it withdrew it.
          oneOf:
            - type: string
              minLength: 1
              maxLength: 128
            - type: 'null'
        actor_account_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        scope_id:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
    NotificationPage:
      type: object
      additionalProperties: false
      required:
        - items
        - cursor
        - snapshot_id
        - revision
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Notification'
        cursor:
          type:
            - string
            - 'null'
          maxLength: 2048
        snapshot_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 0
    NotificationPreferences:
      description: 'What the participant decided. The five category flags decide whether an inbox item is created at all; quiet hours and the two opt-in timestamps decide only whether a best-effort transport carries a hint about an item that exists either way. Every declared event type names one of these categories in packages/schemas/notification-delivery-v1.schema.json#/$defs/event_categories, which is the map PF-027 added: four flags governed eight event types, compatibility and release fell under none of them, and the suppression cause `category-disabled` named a category no artifact defined.'
      type: object
      additionalProperties: false
      required:
        - account_id
        - social_enabled
        - ranking_enabled
        - moderation_enabled
        - product_enabled
        - security_enabled
        - quiet_hours_scope
        - timezone_name
        - push_opt_in_at
        - email_opt_in_at
      properties:
        account_id:
          type: string
          format: uuid
        social_enabled:
          type: boolean
        ranking_enabled:
          type: boolean
        moderation_enabled:
          type: boolean
        product_enabled:
          description: Compatibility and release notices. They had no flag at all before PF-027, so a worker deciding whether to create one had no preference to read.
          type: boolean
        security_enabled:
          description: Always true. Security and recovery notices cannot be muted, the SQL column is constrained true, and the request body carries no field for it.
          const: true
        quiet_hours_start_minute:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 1439
        quiet_hours_end_minute:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 1439
        quiet_hours_scope:
          description: Fixed rather than configurable. The inbox is the notification authority, so an inbox item withheld overnight is a lost notification and not a deferred one.
          const: best-effort-transports-only
        timezone_name:
          type: string
          minLength: 1
          maxLength: 64
        push_opt_in_at:
          type:
            - string
            - 'null'
          format: date-time
        email_opt_in_at:
          type:
            - string
            - 'null'
          format: date-time
    NotificationPreferencesUpdate:
      description: 'The settable half. `security_enabled`, `quiet_hours_scope`, `push_opt_in_at` and `email_opt_in_at` are absent: the first two are constants, and the two opt-in timestamps record a consent granted through the transport enrollment path rather than a value a preferences write may assert on the participant''s behalf.'
      type: object
      additionalProperties: false
      required:
        - social_enabled
        - ranking_enabled
        - moderation_enabled
        - product_enabled
        - timezone_name
      properties:
        social_enabled:
          type: boolean
        ranking_enabled:
          type: boolean
        moderation_enabled:
          type: boolean
        product_enabled:
          type: boolean
        quiet_hours_start_minute:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 1439
        quiet_hours_end_minute:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 1439
        timezone_name:
          type: string
          minLength: 1
          maxLength: 64
