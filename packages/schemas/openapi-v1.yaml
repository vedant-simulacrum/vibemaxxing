          type: integer
          minimum: 0
          maximum: 100000
        board_count:
          type: integer
          minimum: 0
          maximum: 10000
        top_model_alias:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 64
          description: Resolved model alias carrying the largest share of this participant's credited burn in the current period, or null when no period has qualifying activity. It is an accounting dimension, never a prompt, a response or anything derived from content.
