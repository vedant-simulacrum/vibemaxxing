components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: 'Native access handle under ADR-015: 256 bits from a cryptographically secure random source, base64url without padding, carrying no encoded claims and stored server-side as a SHA-256 digest. It is a lookup key into a session record, never a self-contained assertion, because per-session revocation takes effect on the next request. It never satisfies an operation on its own; deviceProof accompanies it.'
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-vm_session
      description: Browser access handle. Secure, HttpOnly, SameSite=Lax, Path=/, __Host- prefixed, valid 15 minutes from issue. SameSite=Lax rather than Strict because the OAuth redirect returns by top-level navigation.
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Host-vm_refresh
      description: Browser refresh handle, valid 30 days from issue with the family capped at 90 days absolute from first authentication. It authenticates refreshSession and no other operation.
    csrfToken:
      type: apiKey
      in: header
      name: X-VibeMaxxing-CSRF
      description: Double-submitted token bound to the session record. Every state-changing cookie-authenticated request carries it, because the SameSite attribute is not treated as the whole cross-site defence.
    deviceProof:
      type: apiKey
      in: header
      name: VibeProof-Device-Proof
      description: COSE_Sign1 detached signature from the enrolled Ed25519 device key over the HTTP method, the request path with query, the SHA-256 digest of the body, the session handle digest, a millisecond timestamp and a 128-bit nonce. The server rejects a proof outside a 300-second window, a nonce already seen inside that window, or a signing key that is not the key bound to the session record.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ConsolidationCaseId:
      name: consolidation_case_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdentityId:
      name: identity_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Handle:
      name: handle
      in: path
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 30
    OAuthCode:
      name: code
      in: query
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 2048
    OAuthState:
      name: state
      in: query
      required: true
      schema:
        type: string
        pattern: ^[0-9a-f]{64}$
    OAuthIssuer:
      name: iss
      in: query
      required: false
      description: 'The stored provider-capability record is packages/schemas/oauth-provider-registry-v1.json, and rfc9207_iss.capability on the row for this callback''s provider decides what this parameter means. Under `supported` ADR-015 fails closed and an authorization response arriving without an iss is refused, so the parameter is required. Under `unverified`, which is where both launch providers stand because no authorization response from either has been observed, the value is compared when present and never required, and the binding that actually refuses a mix-up is the unique provider-specific callback path. The parameter is declared identically on both callbacks because both rows record the same capability; it was previously declared on one and not the other, which stated a capability difference nothing recorded. The callback value is compared with the immutable transaction issuer and never selects provider configuration.'
      schema:
        type: string
        format: uri
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Client-generated idempotency key. It is unique per (principal, operationId) rather than per account, so the same key presented against a different operation is a different ledger row. See the x-idempotency-contract block at the document root.
    Origin:
      name: Origin
      in: header
      required: false
      schema:
        type: string
        enum:
          - https://vibemaxxing.dev
          - https://www.vibemaxxing.dev
          - http://localhost:3000
      description: 'Browser-set request origin, matched against the exact allowlist in the x-origin-policy block. Required under the cookie-session security alternative and refused when absent there, because every browser sends Origin on POST and DELETE, so its absence means the request did not come from one; not sent under the bearer alternative, because a native client is not a browser and has no origin. OpenAPI cannot make a parameter required under one security alternative and absent under another, so the parameter is declared optional here and the conditional rule is carried by packages/schemas/origin-policy-v1.json, whose state_changing_checks entry for origin-exact-match records missing_header as refuse. A value outside the enum answers 403 with reason code ORIGIN_NOT_ALLOWED. The third entry is present only in the local build and is compiled out of the production artifact rather than configured off.'
    Scope:
      name: scope
      in: path
      required: true
      description: 'The viewer-relative cohort scopes only. `global` is absent because it has its own unauthenticated path, and `board` is absent because a board standing needs the board identifier that /boards/{id}/leaderboard/{period} carries. The audience enum in packages/schemas/ranking-view-v1.schema.json still holds all four, because a stored audience is not a request.'
      schema:
        enum:
          - friends
          - rivals
    Period:
      name: period
      in: path
      required: true
      schema:
        enum:
          - daily
          - weekly
          - monthly
          - seasonal
          - yearly
          - lifetime
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 2048
      description: 'Opaque forward cursor returned as the cursor field of the previous page. A client never constructs one and never parses one. Its record shape is packages/schemas/ranking-cursor-v1.schema.json and the five refusals are evaluated in the fixed order that file declares: a cursor the server did not issue, an expired one, one issued to a different principal, one anchored in a generation that is no longer active, and one whose authorization revision the viewer has since moved past. Each is a case in conformance/planning/ranking-cursor-vectors-v1.json. Until PF-022 this sentence named three refusals and no field in the repository held anything either of them could compare.'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
      description: Page size. The default is 50 and the maximum is 200, which is the same bound the items array of every page schema carries.
    RankingView:
      name: ranking_view_id
      in: query
      required: false
      schema:
        type: string
        pattern: ^[0-9a-f]{64}$
  responses:
    Problem:
      description: Stable typed problem envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Preflight:
      description: 'CORS preflight answer. It is produced by the edge before routing and never by an operation, which is why this component is referenced by the x-origin-policy block rather than by an options entry on every path. An allowlisted origin receives 204 with the six headers below. An origin that is not on the list receives 204 with no Access-Control-* header at all and no body, and the browser blocks the request itself: an error body would tell a probing page whether an origin is known. There is no third response, because a preflight that is refused loudly is a preflight that answers a question the caller was not entitled to ask.'
      headers:
        Access-Control-Allow-Origin:
          required: false
          description: The exact request origin when it is on the allowlist, never a wildcard and never reflected without a match. Absent entirely for an origin that is not on the list.
          schema:
            type: string
            enum:
              - https://vibemaxxing.dev
              - https://www.vibemaxxing.dev
              - http://localhost:3000
        Access-Control-Allow-Methods:
          required: false
          schema:
            type: string
            const: GET, POST, DELETE
        Access-Control-Allow-Headers:
          required: false
          schema:
            type: string
            const: Content-Type, Idempotency-Key, If-Match
        Access-Control-Expose-Headers:
          required: false
          schema:
            type: string
            const: Retry-After, RateLimit, RateLimit-Policy, X-Request-Id
        Access-Control-Allow-Credentials:
          required: false
          schema:
            type: string
            const: 'true'
        Access-Control-Max-Age:
          required: false
          description: Ten minutes is long enough to remove the preflight from an interactive session and short enough that revoking an origin takes effect within a coffee break.
          schema:
            type: integer
            const: 600
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadRequest:
      description: The request could not be parsed or a parameter failed its declared shape
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: No usable session credential was presented, or the one presented is expired, revoked, replayed, or unaccompanied by a valid device proof
      headers:
        WWW-Authenticate:
          required: true
          schema:
            type: string
            maxLength: 512
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The principal is authenticated and is not permitted to perform this operation on this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No resource is addressed by this path for this principal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request contradicts the current state of the addressed aggregate or of its idempotency ledger row
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: The idempotency record for this key aged past its retention window and its recorded response no longer exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: The request body media type is not one this operation accepts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableContent:
      description: The request parsed and was rejected on its meaning rather than its shape
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - reason_code
        - retryable
        - details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          maxLength: 120
        status:
          type: integer
          minimum: 400
          maximum: 599
        reason_code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{2,63}$
        retryable:
          type: boolean
        details:
          type: array
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required:
              - field
              - issue
            properties:
              field:
                type: string
                maxLength: 120
              issue:
                enum:
                  - invalid
                  - missing
                  - conflict
                  - expired
                  - forbidden
                  - too_large
    TransitionReceipt:
      type: object
      additionalProperties: false
      required:
        - transition_id
        - state
        - revision
        - committed_at
      properties:
        transition_id:
          type: string
          format: uuid
        state:
          type: string
          minLength: 1
          maxLength: 64
        revision:
          type: integer
          minimum: 1
        committed_at:
          type: string
          format: date-time
    InviteRedemptionRequest:
      type: object
      additionalProperties: false
      required:
        - invite_code
      properties:
        invite_code:
          type: string
          minLength: 25
          maxLength: 29
          pattern: ^[0-9A-Za-z]{5}(?:-?[0-9A-Za-z]{5}){4}$
          description: 'A private-beta invite code: 125 bits from a cryptographically secure random source, encoded in Crockford base 32 as 25 characters and displayed in five groups of five. The server normalises before hashing — uppercase, hyphens and whitespace removed, and the Crockford confusable folding that maps I and L to 1 and O to 0 — so a transcription error in those characters is accepted rather than refused. The generating alphabet excludes I, L, O and U, so the folding costs no entropy.'
    InviteRedemption:
      type: object
      additionalProperties: false
      required:
        - redeemed_at
        - revision
      properties:
        redeemed_at:
          type: string
          format: date-time
          description: When the redemption row committed. A byte-identical replay under the same idempotency key returns the original instant rather than the replay instant.
        revision:
          type: integer
          minimum: 1
          description: Revision of the invite-code aggregate after the redemption committed.
      description: The response deliberately carries no invite identifier, no issuer identifier and no invite-code lifecycle state. Under D-284 the issuer is not disclosed to the invitee, so nothing here names the person who issued the code.
    OAuthStartRequest:
      type: object
      additionalProperties: false
      required:
        - intended_action
      properties:
        intended_action:
          description: 'What the transaction is for. The two values are the CHECK literals on oauth_transactions.intended_action and are kebab-case like every other vocabulary in this repository; they were snake_case here and unconstrained in the DDL, so the API held a vocabulary the persistence owner did not and neither spelling could be compared with the other.'
          enum:
            - sign-in
            - link-identity
    OAuthStart:
      type: object
      additionalProperties: false
      required:
        - transaction_id
        - authorization_url
        - expires_at
      properties:
        transaction_id:
          type: string
          format: uuid
        authorization_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    OAuthCompletion:
      description: 'What a callback returns, and where the two intended actions stop being the same operation. A sign-in callback consumes the transaction and mints browser access, so it reaches `consumed` and carries both an account and a session. A link callback does neither: it verifies the stored redirect, state, PKCE and lifetime, moves the transaction to `callback-received`, and stops. The link itself is performed by linkIdentity, which is authenticated, CSRF-protected, recent-auth gated and idempotent — none of which a public callback can be. The previous shape required account_id and session_id unconditionally, so the contract said a link callback mints a session, which is the thing oauth_transactions now refuses at the constraint level.'
      type: object
      additionalProperties: false
      required:
        - transaction_id
        - intended_action
        - state
      properties:
        transaction_id:
          type: string
          format: uuid
        intended_action:
          enum:
            - sign-in
            - link-identity
        account_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        state:
          enum:
            - callback-received
            - consumed
      allOf:
        - if:
            properties:
              intended_action:
                const: sign-in
            required:
              - intended_action
          then:
            required:
              - account_id
              - session_id
            properties:
              state:
                const: consumed
        - if:
            properties:
              intended_action:
                const: link-identity
            required:
              - intended_action
          then:
            not:
              required:
                - session_id
            properties:
              state:
                const: callback-received
    DeviceAuthStartRequest:
      type: object
      additionalProperties: false
      required:
        - installation_id
        - device_name
        - profile_id
      properties:
        installation_id:
          type: string
          format: uuid
        device_name:
          type: string
          minLength: 1
          maxLength: 80
        profile_id:
          type: string
          pattern: ^[a-z0-9]+(?:[.-][a-z0-9]+)*$
          description: Must resolve to a registered limited-input or headless interactive profile. Desktop and CI profiles are rejected.
    DeviceAuthorization:
      type: object
