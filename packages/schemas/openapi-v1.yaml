        - advertised
        - validation_state
      properties:
        platform_profile_id:
          type: string
          minLength: 1
          maxLength: 256
        os_family:
          type: string
          minLength: 1
          maxLength: 256
        os_version:
          type: string
          minLength: 1
          maxLength: 256
        architecture:
          type: string
          minLength: 1
          maxLength: 256
        environment:
          type: string
          minLength: 1
          maxLength: 256
        advertised:
          type: boolean
        validation_state:
          enum:
            - planned
            - candidate
            - exercised
            - certified
            - published
            - degraded
            - blocked
            - suspended
            - retired
    CompatibilityPage:
      type: object
      additionalProperties: false
      required:
        - items
        - minimum_supported_release_version
        - floor_effective_at
        - cursor
        - snapshot_id
        - revision
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/CompatibilityProfile'
        minimum_supported_release_version:
          description: 'The moving version floor D-570 refuses clients below, published here because this is the one public reference-data operation a refused client can still reach. A 426 with CLIENT_VERSION_UNSUPPORTED says the client is below the floor; this says what the floor is. It is a page-level field rather than a per-profile one because the floor is a property of the interface, not of the operating system the client runs on. The persistence owner is planning-schema.sql#update_policies.'
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$
        floor_effective_at:
          description: When this floor takes effect. A floor with no effective instant is one a client cannot tell it has time to meet.
          type: string
          format: date-time
        cursor:
          type:
            - string
            - 'null'
          maxLength: 2048
        snapshot_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 0
    SelfRankEntry:
      type: object
      additionalProperties: false
      description: The participant's own standing. ADR-020 makes this surface, and only this surface, show Token Burn, the composite weight and both factors, because a participant who is discounted and cannot see that they are discounted has no appeal right in practice. Every field here is recomputable from the entry's own recorded inputs.
      required:
        - entry
        - token_burn_total
        - confidence_weight_hundredths
        - evidence_factor_hundredths
        - trust_factor_hundredths
        - trust_notice_id
        - recent_credited_token_burn
      properties:
        entry:
          $ref: '#/components/schemas/RankEntry'
        token_burn_total:
          type: integer
          minimum: 0
          description: The accepted, immutable, unnormalized accounting quantity. It appears on no other response in this document.
        confidence_weight_hundredths:
          type: integer
          minimum: 25
          maximum: 100
          description: max(25, floor(evidence factor x trust factor / 100)). The floor is 25 rather than 0 because a weight of zero removes a participant from the standings without saying so, which destroys the appeal right D-084 depends on.
        evidence_factor_hundredths:
          type: integer
          minimum: 25
          maximum: 100
          description: The factor keyed by the awarded evidence profile.
        trust_factor_hundredths:
          type: integer
          minimum: 25
          maximum: 100
          description: The factor keyed by the ranked-identity eligibility of this participant.
        trust_notice_id:
          type:
            - string
            - 'null'
          format: uuid
          description: The server-inbox notification that explains why the trust factor is below 100, or null when it is 100. This is the reference ADR-020 requires so that an appeal is about a number rather than about a feeling.
        recent_credited_token_burn:
          type: array
          maxItems: 30
          description: Credited Token Burn per completed period, oldest first, over the trailing window this ranking view publishes.
          items:
            type: integer
            minimum: 0
    SessionRefreshRequest:
      type: object
      additionalProperties: false
      description: Native refresh. A browser omits the body and presents __Host-vm_refresh instead.
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 32
          maxLength: 4096
    RefreshedSession:
      type: object
      additionalProperties: false
      description: The rotated credential pair. A browser receives replacement __Host-vm_session and __Host-vm_refresh cookies and reads access_token as null; a native client reads the replacement access handle here.
      required:
        - session_id
        - kind
        - family_generation
        - access_token
        - expires_at
        - refresh_expires_at
      properties:
        session_id:
          type: string
          format: uuid
        kind:
          enum:
            - web
            - native
        family_generation:
          type: integer
          minimum: 1
        access_token:
          type:
            - string
            - 'null'
          minLength: 32
          maxLength: 4096
        expires_at:
          type: string
          format: date-time
        refresh_expires_at:
          type: string
          format: date-time
        family_expires_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Absolute end of the family, 90 days from first authentication for a web family and null for a native family, whose refresh window slides without an absolute cap.
        device_key_thumbprint:
          type:
            - string
            - 'null'
          pattern: ^[0-9a-f]{64}$
