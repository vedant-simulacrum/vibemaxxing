# VibeMaxxing Public API — OpenAPI 3.1 planning contract.
#
# This document is YAML. It was JSON under a `.yaml` name until D-140; the contents
# were converted rather than the path renamed, because `conformance/p1140f/` pins this
# path and is owned elsewhere. Readers parse it with a YAML parser.
#
# Session authentication follows `docs/decisions/ADR-015-SESSION_AUTHENTICATION.md`.
# Ranking figures follow `docs/decisions/ADR-020-CONFIDENCE_WEIGHTED_RANKING.md`.
#
# The operation-to-status-to-reason-code matrix is not written here.
# `packages/schemas/reason-codes-v1.json` holds it, and
# `scripts/repository/validate_planning_artifacts.py` fails when the two disagree.
openapi: 3.1.0
info:
  title: VibeMaxxing Public API
  version: 1.0.0-p1140d
  description: P-1140D planning contract. Implementation remains unauthorized.
servers:
  - url: https://api.vibemaxxing.dev/v1
x-idempotency-contract:
  ledger: packages/schemas/state-machine-registry-v1.json#idempotency-ledger
  key_scope:
    - principal_type
    - principal_id
    - operation_id
    - idempotency_key
  principal: The account the session resolves to and, for a native session, the device enrollment bound to that session. `principal_type` records which of the two a row addresses, because `principal_id` names a row in `accounts` or in `devices` and a foreign key could only point at one of them. Two principals presenting the same key against the same operation hold two independent ledger rows.
  request_digest: 'SHA-256 over the canonical request: the uppercase method, the path with its query in the order the server sorts it, the exact request body bytes, and the principal. The digest decides replay against conflict and is recorded on reservation.'
  response_record: The committed response is recorded in full — status, the ordered response header set this contract publishes, and the exact body bytes — so a replay returns it byte-identically rather than recomputing it. The record is not nullable on a committed row.
  replay_header: Idempotency-Replayed
  executing_recovery: A second request arriving while the row is executing and carrying the same digest waits for the in-flight transaction and then returns the recorded response. An executing row whose transaction did not commit moves to abandoned on lease expiry and the key becomes usable again. An operation that ran and failed in a way that is safe to retry moves to replayable-failure instead, which records that it ran; abandoned records that it did not. Distinguishing the two is what lets a retry be answered without guessing whether the first attempt had an effect.
  conflict:
    ledger_state: conflict
    status: 409
    reason_code: IDEMPOTENCY_KEY_CONFLICT
    condition: The key exists for this principal and operation with a different request digest. The stored response is not returned and the new request is not executed.
  expiry:
    ledger_state: expired
    status: 410
    reason_code: IDEMPOTENCY_RECORD_EXPIRED
    replay_window_hours: 168
    replay_window_column: expires_at
    row_retention_column: retain_until
    row_retention_policy_key: idempotency_record_retention_days
    condition: The key was committed and its record aged past the replay window, so the response bytes no longer exist to replay. The request is not re-executed under the same key.
    two_dates: >-
      PF-020. The replay window and the row's own lifetime are different dates and were
      the same column. D-225 fixes the window at 168 hours; idempotency_record_retention_days
      in packages/schemas/policy-defaults-v1.json governs how long the row survives it,
      default 30 days. While one column bounded both, the only way to stop replaying a
      response was to delete the row, and a deleted key is a fresh key, so the next request
      carrying it was executed as a new mutation rather than refused.
      idempotency_records_retained_past_replay_window requires retain_until to be strictly
      later than expires_at, and idempotency_records_expired_holds_no_response requires an
      expired row to hold no status, no body and no digest, so the refusal outlives the
      answer and the discarded bytes are discarded by constraint rather than by application
      code.
  ambiguous_commit: >-
    The effect, this ledger row, the audit row, the outbox row and the recorded response
    commit in one transaction. If the ledger row committed separately, a crash between the
    two commits would leave the same rows as a crash before either and no retry could
    distinguish them. conformance/p1140e/sql-race-plans-v1.json names the exact rows each of
    the five ambiguous-commit cases leaves behind, and
    docs/architecture/SERVER_API_DATA_AND_RANKING_CONTRACT.md owns the prose.
  finding_state: >-
    SR-012's three persistence defects are repaired. PF-019 keyed the table on the declared
    scope, PF-049 replaced the nullable digest with a recorded status, body and digest, and
    PF-020 split the replay window from the row's retention. Repaired is not closed. No agent
    records a closure verdict, and conformance/p1140f/semantic-findings-v1.json remains the
    only authority for the finding's state.
x-origin-policy:
  contract: packages/schemas/origin-policy-v1.json
  normative_owner: docs/security/ORIGIN_AND_LOOPBACK_CONTROLS.md
  description: 'The origin arm of the ADR-015 requirement that every state-changing request carry either an allowlisted Origin or a session-bound CSRF token. PF-039 landed the token arm as the csrfToken scheme; this block is the other half, expressed where a middleware generator can consume it. Every value here is a projection of packages/schemas/origin-policy-v1.json and scripts/repository/validate_planning_artifacts.py asserts the two are identical field by field, in the same way the reason registry records its own copy of the operation classes and has it derived and compared rather than trusted. The contract file additionally covers the loopback listeners, which are not the public API and have no presence in this document at all.'
  parameter_binding:
    origin_parameter: '#/components/parameters/Origin'
    preflight_response: '#/components/responses/Preflight'
    required_on_security_scheme: csrfToken
    preflight_routing: edge-before-routing
    rule: Every operation whose security includes csrfToken declares the Origin parameter, and no operation that omits csrfToken may declare it. Preflight is answered by the edge before routing rather than by an options operation on every path, because no CORS implementation routes a preflight to an operation.
  wildcard_origin: never
  origin_reflection: never
  subdomain_wildcard: never
  allowed_origins:
    - origin: https://vibemaxxing.dev
      purpose: the hosted web application
      credentials: allowed
      environments: [production, staging, local]
      production_build: included
    - origin: https://www.vibemaxxing.dev
      purpose: canonical redirect target
      credentials: allowed
      environments: [production, staging, local]
      production_build: included
    - origin: http://localhost:3000
      purpose: local development only
      credentials: allowed
      environments: [local]
      production_build: compiled-out
  preflight:
    allow_methods: [GET, POST, DELETE]
    allow_headers: [Content-Type, Idempotency-Key, If-Match]
    expose_headers: [Retry-After, RateLimit, RateLimit-Policy, X-Request-Id]
    allow_credentials: 'true'
    max_age_seconds: 600
    unlisted_origin_response:
      status: 204
      access_control_headers: none
      body: none
  state_changing_checks:
    - order: 1
      check_id: origin-exact-match
      applies_to: cookie-session
      enforced_by: server
      on_failure:
        status: 403
        reason_code: ORIGIN_NOT_ALLOWED
      missing_header: refuse
      rationale: Scheme, host and port must match an allowlist entry exactly. Origin is a header and a request that is not from a browser can set it to anything, which is why it is not sufficient alone against a native attacker.
    - order: 2
      check_id: double-submitted-csrf-token
      applies_to: cookie-session
      enforced_by: server
      on_failure:
        status: 403
        reason_code: CSRF_TOKEN_INVALID
      missing_header: refuse
      rationale: The csrfToken scheme in packages/schemas/openapi-v1.yaml, carried in X-VibeMaxxing-CSRF and compared against the value stored with the session. It is the only one of the three an attacker cannot produce without already reading a response from the allowlisted origin.
    - order: 3
      check_id: samesite-lax-session-cookie
      applies_to: cookie-session
      enforced_by: browser
      on_failure:
        status: 403
        reason_code: null
      missing_header: not-applicable
      rationale: ADR-015 sets SameSite=Lax on the session cookie, which stops a cross-site POST before the request is dispatched. It carries no reason code because a browser that enforces it produces no server response.
  bearer_exemption:
    exempt_checks: [origin-exact-match, double-submitted-csrf-token]
    rationale: A cross-site request cannot attach a bearer credential the attacking page does not hold, so cross-site request forgery does not apply. Native client requests are exempt from these two checks and from nothing else; the native client is not a browser and has no origin at all.
x-public-operations:
  # Every operation carrying `security: []` must appear here with a reason, and
  # scripts/repository/validate_planning_artifacts.py fails on any that does not.
  # Writing `security: []` is not by itself authority to be public: getPublicProfile
  # carried it while its own schema described "what a viewer authorized to read this
  # profile receives", and projection-authorization-v1.json makes directional-block
  # deny-hard and subject-visibility deny-unless-authorized. An unauthenticated caller
  # has no viewer identity, so neither input could be evaluated and a blocked person
  # could read the profile by logging out. It now requires a viewer.
  #
  # Three reason classes, and nothing else is admissible:
  #   auth-bootstrap  — establishes the very session a viewer check would need.
  #   global-board    — the one universally public view AGENTS.md names.
  #   reference-data  — carries no participant, so no viewer is relevant to it.
  #
  # `global-board` was held by `getLeaderboard`, whose path was
  # `/leaderboards/{scope}/{period}` and whose `Scope` enum admitted `global`,
  # `friends`, `rivals` and `board`. The reason named one of those four values and
  # the declaration covered all of them, so `GET /leaderboards/friends/weekly`
  # answered an unauthenticated caller with a viewer-relative standing, and
  # `GET /leaderboards/board/weekly` named no board at all. PF-052 recorded that
  # this operation would lose its `security: []`, landed without doing it, and left
  # the note in place. The global board now has its own path and holds the reason
  # alone; the cohort and board paths require a session.
  startGitHubAuth: auth-bootstrap
  completeGitHubAuth: auth-bootstrap
  startXAuth: auth-bootstrap
  completeXAuth: auth-bootstrap
  startDeviceAuth: auth-bootstrap
  pollDeviceAuth: auth-bootstrap
  exchangeDeviceAuth: auth-bootstrap
  getGlobalLeaderboard: global-board
  listPricingDatasets: reference-data
  getCompatibility: reference-data

x-response-cache-policy:
  # The cache arm of D-386. `evaluation.cache_policy` in
  # packages/schemas/projection-authorization-v1.json forbids storing an
  # authorization result, and docs/privacy/PRIVACY_CONTRACT.md adds that a projection
  # may be cached only when it is identical for every viewer. Until PF-033 the
  # document expressed neither: not one response declared a cache directive, so a
  # proxy, a CDN or a browser back-forward cache was free to store
  # `GET /profiles/{handle}` and hand it to a second viewer, which is the SR-015
  # defect with the staleness measured in hours rather than statements.
  #
  # Two values, and the split is derived rather than listed twice:
  #   public-shared — exactly the operations x-public-operations gives the
  #                   `global-board` or `reference-data` reason. Both carry a
  #                   response identical for every reader, which is the only
  #                   condition under which the privacy contract permits a cache.
  #   no-store      — everything else, including every `auth-bootstrap` operation:
  #                   those are public because they establish a session, not because
  #                   their bodies are, and they carry authorization codes and
  #                   session handles.
  #
  # scripts/repository/validate_planning_artifacts.py recomputes this map from
  # x-public-operations and asserts equality, so a new operation is `no-store` by
  # construction and a hand-edit that widens one fails.
  startGitHubAuth: no-store
  completeGitHubAuth: no-store
  startXAuth: no-store
  completeXAuth: no-store
  startDeviceAuth: no-store
  pollDeviceAuth: no-store
  exchangeDeviceAuth: no-store
  refreshSession: no-store
  listSessions: no-store
  revokeSession: no-store
  revokeAllSessions: no-store
  listIdentities: no-store
  linkIdentity: no-store
  unlinkIdentity: no-store
  reportProviderAccess: no-store
  cancelIdentityUnlink: no-store
  redeemInvite: no-store
  listDevices: no-store
  enrollDevice: no-store
  rotateDeviceKey: no-store
  revokeDevice: no-store
  createClaimChallenge: no-store
  submitClaimBatch: no-store
  getClaim: no-store
  getAppraisal: no-store
  getGlobalLeaderboard: public-shared
  getLeaderboard: no-store
  getBoardLeaderboard: no-store
  getCurrentRank: no-store
  getPublicProfile: no-store
  getMe: no-store
  updateMe: no-store
  listFriends: no-store
  listFriendRequests: no-store
  createFriendRequest: no-store
  listBlocks: no-store
  createBlock: no-store
  listRivals: no-store
  createRival: no-store
  listBoards: no-store
  createBoard: no-store
  createBoardInvitation: no-store
  listOrganizations: no-store
  createOrganization: no-store
  listCommunities: no-store
  createCommunity: no-store
  getPresence: no-store
  renewPresence: no-store
  listNotifications: no-store
  getNotificationPreferences: no-store
  updateNotificationPreferences: no-store
  markNotificationRead: no-store
  listModerationCases: no-store
  createModerationCase: no-store
  listAppeals: no-store
  createAppeal: no-store
  requestExport: no-store
  revokeExportDownloadGrant: no-store
  requestDeletion: no-store
  cancelDeletion: no-store
  getConsolidationPlan: no-store
  confirmConsolidation: no-store
  listPricingDatasets: public-shared
  getCompatibility: public-shared

