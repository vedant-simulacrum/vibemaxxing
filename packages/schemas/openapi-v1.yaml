  /auth/session/refresh:
    post:
      operationId: refreshSession
      x-authorization: authenticated-account
      x-recent-auth: not-required
      x-idempotency: single-use-refresh-handle
      description: 'Rotate a session family. Refresh is one-time-use: presenting a handle moves the family to rotating, atomically consumes the presented handle and issues a new access and refresh pair in the same transaction with the family generation incremented. A browser presents __Host-vm_refresh and receives replacement cookies; a native client presents the handle in the body together with a device proof from the bound key and receives the replacement access handle in the response. Presenting a handle that was already consumed is a replay: the family moves to replay-detected, every handle in every generation is revoked and the account owner receives a server-inbox security notice. There is no grace window, so a client that loses this response reauthenticates.'
      security:
        - refreshCookie: []
          csrfToken: []
        - deviceProof: []
      responses:
        '200':
          description: RefreshedSession
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshedSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
