# VibeMaxxing Public API — OpenAPI 3.1 planning contract.
#
# This document is YAML. It was JSON under a `.yaml` name until D-140; the contents
# were converted rather than the path renamed, because `conformance/p1140f/` pins this
# path and is owned elsewhere. Readers parse it with a YAML parser.
#
# Session authentication follows `docs/decisions/ADR-015-SESSION_AUTHENTICATION.md`.
# Ranking figures follow `docs/decisions/ADR-020-CONFIDENCE_WEIGHTED_RANKING.md`.
#
# The operation-to-status-to-reason-code matrix is not written here.
# `packages/schemas/reason-codes-v1.json` holds it, and
# `scripts/repository/validate_planning_artifacts.py` fails when the two disagree.
openapi: 3.1.0
info:
  title: VibeMaxxing Public API
  version: 1.0.0-p1140d
  description: P-1140D planning contract. Implementation remains unauthorized.
servers:
  - url: https://api.vibemaxxing.dev/v1
x-idempotency-contract:
  ledger: packages/schemas/state-machine-registry-v1.json#idempotency-ledger
  key_scope:
    - principal_id
    - operation_id
    - idempotency_key
  principal: The account the session resolves to and, for a native session, the device enrollment bound to that session. Two principals presenting the same key against the same operation hold two independent ledger rows.
  request_digest: 'SHA-256 over the canonical request: the uppercase method, the path with its query in the order the server sorts it, the exact request body bytes, and the principal. The digest decides replay against conflict and is recorded on reservation.'
  response_record: The committed response is recorded in full — status, the ordered response header set this contract publishes, and the exact body bytes — so a replay returns it byte-identically rather than recomputing it. The record is not nullable on a committed row.
  replay_header: Idempotency-Replayed
  reserved_recovery: A second request arriving while the row is reserved and carrying the same digest waits for the in-flight transaction and then returns the recorded response. A reserved row whose transaction did not commit moves to failed on lease expiry and the key becomes usable again.
  conflict:
    ledger_state: conflict
    status: 409
    reason_code: IDEMPOTENCY_KEY_CONFLICT
    condition: The key exists for this principal and operation with a different request digest. The stored response is not returned and the new request is not executed.
  expiry:
    ledger_state: expired
    status: 410
    reason_code: IDEMPOTENCY_RECORD_EXPIRED
    retention_hours: 168
    condition: The key was committed and its record aged past the retention window, so the response bytes no longer exist to replay. The request is not re-executed under the same key.
  open_finding: SR-012 stays open. This block is the API half. The persistence half — the nullable response_digest, the missing response-body column and the account-only primary key in packages/schemas/planning-schema.sql — is not repaired here and no closure evidence is recorded.
