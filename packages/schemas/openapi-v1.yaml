        - appraisal_id
        - accepted_at
      properties:
        claim_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 0
        state:
          enum:
            - accepted
            - corrected
            - retracted
            - quarantined
        payload_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
        appraisal_id:
          type: string
          format: uuid
        accepted_at:
          type: string
          format: date-time
    RankEntry:
      type: object
