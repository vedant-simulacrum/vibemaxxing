    DeletionJob:
      type: object
      additionalProperties: false
      required:
        - deletion_job_id
        - state
        - requested_at
        - effective_after
        - device_outcomes
      properties:
        deletion_job_id:
          type: string
          format: uuid
        state:
          enum:
            - requested
            - recent-auth-verified
            - cooling-off
            - processing
            - awaiting-local-receipt
            - complete
            - failed
        requested_at:
          type: string
          format: date-time
        effective_after:
          type: string
          format: date-time
        device_outcomes:
          description: >-
            One entry per enrolled device, always. D-076 requires each device to be
            reported independently, and a job whose state is `complete` may still
            carry devices that are `pending`, `unreachable` or `waived`: the hosted
            erasure does not wait for a device that may never return. The array is
            required rather than optional so that a client cannot render a single
            success by omitting it.
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/LocalDeletionOutcome'
    LocalDeletionOutcome:
      description: >-
        What one device did with one deletion command. `disposition` is the whole
        answer and is derived from the command row rather than chosen: see
        `local_deletion_commands` in packages/schemas/planning-schema.sql. The
        receipt fields are present exactly when a signed receipt arrived, and
        `residual_risk` is reported rather than resolved — the strongest value it
        offers is `none-observed`, which says observed and not none.
      type: object
      additionalProperties: false
      required:
        - device_id
        - disposition
        - issued_at
        - expires_at
      properties:
        device_id:
          type: string
          format: uuid
        disposition:
          enum:
            - pending
            - complete
            - failed
            - expired
            - unreachable
            - waived
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        receipt_received_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        residual_risk:
          description: >-
            Absent until a receipt arrives, and never inferred from its absence. A
            device that never answers reports no residual risk because the product
            observed nothing, not because there is none.
          enum:
            - filesystem-snapshot-possible
            - backup-copy-possible
            - none-observed
