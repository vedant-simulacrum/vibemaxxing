      description: 'An invitation grants a non-privileged membership and nothing else. The enum admitted owner and admin until PF-025, against an acceptance criterion that said board_invites cannot grant them and a board_invites table that held no role column to refuse with: the refusal compared a field no record held. Ownership moves only through the paired transfer, and admin promotion is a separate transition requiring recent authentication, so neither is reachable by accepting an invitation.'
