    Board:
      description: 'One board. `kind` is the same four-value vocabulary as boards.board_type in packages/schemas/planning-schema.sql. Until PF-025 it admitted three, omitting hacker-house, so the one board type the route map publishes a public surface for could not be named in a response and a stored hacker-house board had no representation on the wire at all. `visibility` was published nowhere and stored nowhere, while AGENTS.md makes it load-bearing: only the global leaderboard is universally public by default, so an unlisted or private board view requires current viewer authorization and the rule needs a value to read.'
      type: object
      additionalProperties: false
      required:
        - board_id
        - kind
        - name
        - visibility
        - membership_revision
        - state
      properties:
        board_id:
          type: string
