  /appraisals/{id}:
    get:
      operationId: getAppraisal
      x-authorization: authenticated-account
      x-recent-auth: not-required
      x-idempotency: not-applicable
      description: >-
        The verifier appraisal behind one of the caller's own accepted claims,
        returned as a projection and never as the stored record.


        Self-only in every field. `ClaimRecord` is a self-audience shape under
        D-393 and `ClaimRecord.appraisal_id` is classified `self` there, so an
        appraisal identifier is only ever legible to the participant who
        submitted the claim. There is no non-owner audience for any field of
        this response, and no widening of it exists: a caller who is not that
        participant is answered 404 and never 403, because 403 would confirm
        that the appraisal exists and an appraisal binds one-to-one to a claim,
        so a confirmed identifier is a confirmed submission by someone. The 403
        this operation declares is the caller's own `INVITE_REQUIRED` or
        `NATIVE_SESSION_DEVICE_REVOKED` and is never an ownership answer.


        What the subject does see is the effect on their own standing, which
        D-084 requires be told to the sanctioned participant together with the
        appeal route: `acceptance_outcome`, the seven `dimensions`,
        `awarded_profile_id`, `evidence_class`, `ranking_eligibility`,
        `reason_codes`, `validity` and `supersession`. Appealability is read
        from `packages/schemas/reason-codes-v1.json` against the returned
        reason codes. This operation is not the D-084 notice and does not
        create one; the notice is a server-inbox item.


        Two fields of `VerifierAppraisalResult` are withheld from the subject as
        well as from every other viewer, and the projection exists so that the
        narrowing is a schema boundary rather than a per-response redaction.
        `evaluated.anomaly_disposition` carries `under-review` and
        `shadow-only`; disclosing either tells the participant that an integrity
        case is open, which D-381 forbids — the participant reads the effect on
        their standing and is never told a case exists.
        `policy.implementation_sha256` is the server verifier's own build
        digest, which is not the participant's personal data and is not needed
        to understand or appeal the outcome. Neither field appears in any
        response of this document, so their absence is uniform and carries no
        signal.
      security:
        - sessionCookie: []
        - bearerAuth: []
          deviceProof: []
      responses:
        '200':
          description: AppraisalSummary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppraisalSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
        - $ref: '#/components/parameters/Id'
