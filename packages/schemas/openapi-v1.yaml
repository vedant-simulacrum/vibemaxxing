    PresenceRenewalRequest:
      description: 'One qualifying pulse from one device. It carries no availability and cannot: AGENTS.md states presence is server-derived from qualifying device activity, and the presence-lease machine makes idle and expiry worker transitions, so a request that named a state was the client selecting a server-assigned value. Until PF-026 this body was a single `availability` field over online, idle and offline, declared as a projection of the machine — a coarsening applied to a request, which is the direction the projection cannot run in — and the social contract''s own rule that a browser or ordinary web session cannot fabricate indefinite activity had nothing enforcing it. It carries the device and the lease generation instead, because the discard rule is stated against exactly those two: a pulse naming a superseded generation is dropped rather than applied, and until now neither value reached the server on the write path that the rule governs.'
      type: object
      additionalProperties: false
      required:
        - device_id
        - lease_generation
        - qualifying
      properties:
        device_id:
          type: string
          format: uuid
        lease_generation:
          description: The generation the pulse was minted under. A pulse naming a superseded generation is discarded, which is what stops a resumed process from reviving an expired lease.
          type: integer
          minimum: 0
        qualifying:
          description: Whether the device observed qualifying collector activity in this interval. A boolean and never a description, because a pulse carries no content of any kind.
          type: boolean
    PresenceLease:
      description: The merged answer for one account, not one device. Every device row is folded into a single availability by the deterministic merge in conformance/social/presence-merge-vectors.json, and a viewer the participant's presence visibility excludes reads offline, which is the same value an inactive participant reads.
      type: object
      additionalProperties: false
      required:
        - account_id
