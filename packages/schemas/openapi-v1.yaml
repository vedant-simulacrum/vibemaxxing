  /consolidations/{consolidation_case_id}:
    get:
      operationId: getConsolidationPlan
      summary: Read the consolidation plan this account is being asked to confirm
      description: 'The `account-consolidation` machine declares consolidation-confirm with actor `user`, authentication `web-session` and recent authentication required, and the API declared no consolidation operation at all — so the participant was required by the lifecycle to perform a transition they had no route to, and a case could leave awaiting-confirmation only by expiring. This is the read half. It publishes the plan and no lifecycle value: there is no state field here, because a value like `applying` is an operational fact, and the participant is being asked about the plan rather than about the case. `plan_digest` is what the confirmation names, so a plan cannot be substituted between being read and being confirmed.'
      x-authorization: authenticated-account
      x-recent-auth: not-required
      x-idempotency: not-applicable
      security:
        - sessionCookie: []
        - bearerAuth: []
          deviceProof: []
      responses:
        '200':
          description: ConsolidationPlanView
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsolidationPlanView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
        - $ref: '#/components/parameters/ConsolidationCaseId'
  /consolidations/{consolidation_case_id}/confirmations:
    post:
      operationId: confirmConsolidation
      summary: Confirm the presented consolidation plan under recent authentication
      description: 'The write half, and the only participant-driven transition of the account-consolidation machine. It answers a TransitionReceipt rather than the case, so no lifecycle value is published here either. The request names the digest of the plan that was read; a digest that does not match the current plan is refused, because confirming a plan the participant never saw is the substitution this operation exists to prevent. Confirmation moves the case to applying and nothing else: no total is combined, and the surviving standing is recomputed from claim-level contributions under D-070.'
      x-authorization: authenticated-account
      x-recent-auth: required
      x-idempotency: required-durable-request-hash
      security:
        - sessionCookie: []
          csrfToken: []
        - bearerAuth: []
          deviceProof: []
      responses:
        '202':
          description: TransitionReceipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitionReceipt'
          headers:
            Idempotency-Replayed:
              required: false
              description: Present and true when this response was replayed byte-identically from the idempotency ledger rather than produced by executing the request.
              schema:
                type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/RateLimited'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
        - $ref: '#/components/parameters/ConsolidationCaseId'
        - $ref: '#/components/parameters/Origin'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsolidationConfirmationRequest'
