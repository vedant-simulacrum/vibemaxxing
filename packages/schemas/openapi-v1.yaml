        token_type:
          enum:
            - Device-Bound
        access_token:
          type: string
          minLength: 32
          maxLength: 4096
        expires_at:
          type: string
          format: date-time
        device_key_thumbprint:
          type: string
          pattern: ^[0-9a-f]{64}$
    Session:
      type: object
      additionalProperties: false
      required:
        - session_id
        - kind
        - state
        - created_at
        - expires_at
        - current
        - family_generation
        - family_reason_code
      properties:
        session_id:
          type: string
          format: uuid
        kind:
          enum:
            - web
            - native
        state:
          enum:
            - active
            - revoked
            - expired
            - rotated
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        current:
          type: boolean
        family_reason_code:
          type:
            - string
            - 'null'
          pattern: ^[A-Z][A-Z0-9_]{2,63}$
          description: The reason code from packages/schemas/reason-codes-v1.json that ended this session family, or null while the family is live. WEB_SESSION_REPLAY_DETECTED, NATIVE_SESSION_REPLAY_DETECTED and NATIVE_SESSION_DEVICE_REVOKED carry the family outcomes that the member-level state enum does not name.
        family_generation:
          type: integer
          minimum: 1
          description: Generation counter of the session family, incremented by every rotation.
    SessionPage:
      type: object
      additionalProperties: false
      required:
        - items
        - cursor
        - snapshot_id
        - revision
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Session'
        cursor:
          type:
            - string
            - 'null'
          maxLength: 2048
        snapshot_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 0
    Identity:
      type: object
      additionalProperties: false
      required:
        - identity_id
        - provider
        - subject
        - state
        - linked_at
      properties:
        identity_id:
          type: string
          format: uuid
        provider:
          enum:
            - github
            - x
        subject:
          type: string
          pattern: ^[0-9a-f]{64}$
        state:
          description: 'The six linked-identity states a client is shown. `candidate` and `superseded` are omitted and are declared internal in the binding table of docs/architecture/AUTHORITATIVE_STATE_AND_PLATFORM_CONTRACT.md: a candidate is a link still in flight and has no confirmed binding to report, and a superseded row is history its successor already represents.'
          enum:
            - linked
            - unlink-pending
            - lost
            - compromised
            - recovery-pending
            - unlinked
        linked_at:
          type: string
          format: date-time
    IdentityPage:
      type: object
      additionalProperties: false
      required:
        - items
        - cursor
        - snapshot_id
        - revision
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Identity'
        cursor:
          type:
            - string
            - 'null'
          maxLength: 2048
        snapshot_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 0
    IdentityMutationRequest:
      description: 'The link request. It names an OAuth transaction and nothing else. It previously carried a bare `authorization_code`, which made linkIdentity a second identity-mutating path that referenced no transaction: nothing bound the redirect, the state, the PKCE verifier, the provider revision or the lifetime, so every control the transaction exists to apply was optional in practice. The named transaction must be one this account started with intended_action link-identity and must stand at callback-received; consuming it is what links the provider subject, and it can be consumed once.'
      type: object
      additionalProperties: false
      required:
        - provider
        - oauth_transaction_id
      properties:
        provider:
          enum:
            - github
            - x
        oauth_transaction_id:
          type: string
          format: uuid
    ConsolidationPlanView:
      description: 'What the participant is shown before confirming. It carries counts and per-domain outcomes and no combined figure: D-070 forbids adding two stored account totals, so there is no field here for one, and packages/schemas/consolidation-plan-v1.schema.json is the record this view projects. The eight domain keys are the ones a merge must define ownership of, and all eight are required, so a plan cannot be presented while silent about the absorbed account''s devices, blocks, boards, moderation state, exports or pending deletion.'
      type: object
      additionalProperties: false
      required:
        - consolidation_case_id
        - plan_digest
        - surviving_ranked_identity_id
        - absorbed_ranked_identity_id
        - absorbed_contribution_count
        - excluded_contribution_count
        - affected_period_count
        - domain_dispositions
        - expires_at
        - revision
      properties:
        consolidation_case_id:
          type: string
          format: uuid
        plan_digest:
          description: SHA-256 over the canonical consolidation plan record. The confirmation names it, so a plan cannot be substituted between being read and being confirmed.
          type: string
          pattern: ^[0-9a-f]{64}$
        surviving_ranked_identity_id:
          type: string
          format: uuid
        absorbed_ranked_identity_id:
          type: string
          format: uuid
        absorbed_contribution_count:
          type: integer
          minimum: 0
        excluded_contribution_count:
          type: integer
          minimum: 0
        affected_period_count:
          type: integer
          minimum: 0
        domain_dispositions:
          type: array
          minItems: 8
          maxItems: 8
          items:
            $ref: '#/components/schemas/ConsolidationDomainDisposition'
        expires_at:
          type: string
          format: date-time
        revision:
          type: integer
          minimum: 1
    ConsolidationDomainDisposition:
      type: object
      additionalProperties: false
      required:
        - domain
        - disposition
        - affected_count
      properties:
        domain:
          enum:
            - identities
            - devices
            - claims
            - social
            - boards
            - moderation
            - exports
            - deletions
        disposition:
          enum:
            - transferred
            - retained
            - excluded
            - recomputed
        affected_count:
          description: A count of rows, never a quantity. No property in this document holds a figure derived from two accounts' token burn.
          type: integer
          minimum: 0
    ConsolidationConfirmationRequest:
      type: object
      additionalProperties: false
      required:
        - plan_digest
      properties:
        plan_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
    ProviderAccessReportRequest:
      type: object
      additionalProperties: false
      required:
        - report
      properties:
        report:
          description: 'Which fact the participant is reporting. `lost` means the provider account is no longer reachable; `compromised` means someone else controls it. They are separate values because they lead to different notices and because a compromise, unlike a loss, means the provider identity can no longer be trusted to authorize anything.'
          enum:
            - lost
            - compromised
    IdentityUnlinkRequest:
      description: 'The unlink request. It names the linked identity to remove, because there is nothing to authorize against a provider: unlinking is a change to this account''s own rows. It shared IdentityMutationRequest with linkIdentity, which meant the contract required an authorization code to remove a link — including the case where the provider account is exactly what the participant has lost. Unlinking the last authentication method an account holds is refused; docs/security/AUTHENTICATION_AND_RECOVERY.md owns that invariant and the linked-identity machine carries it as the guard on identity-unlink-request.'
      type: object
      additionalProperties: false
      required:
        - identity_id
      properties:
        identity_id:
          type: string
          format: uuid
    Device:
      type: object
      additionalProperties: false
      required:
        - device_id
        - lineage_id
        - platform_profile_id
        - state
        - key_id
      properties:
        device_id:
          type: string
          format: uuid
        lineage_id:
          type: string
          format: uuid
        platform_profile_id:
          type: string
          minLength: 1
          maxLength: 256
        state:
          enum:
            - pending
            - active
            - quarantined
            - revoked
            - deleted
        key_id:
          type: string
          pattern: ^[0-9a-f]{64}$
    DevicePage:
      type: object
      additionalProperties: false
      required:
        - items
        - cursor
        - snapshot_id
        - revision
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/Device'
        cursor:
          type:
            - string
            - 'null'
          maxLength: 2048
        snapshot_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 0
    DeviceEnrollRequest:
      type: object
      additionalProperties: false
      required:
        - installation_id
        - lineage_id
        - platform_profile_id
        - public_key
      properties:
        installation_id:
          type: string
          format: uuid
        lineage_id:
          type: string
          format: uuid
        platform_profile_id:
          type: string
          minLength: 1
          maxLength: 256
        public_key:
          type: string
          contentEncoding: base64
          maxLength: 128
    DeviceKeyRotationRequest:
      type: object
      additionalProperties: false
      required:
        - previous_key_id
        - new_public_key
        - continuity_signature
      properties:
        previous_key_id:
          type: string
          pattern: ^[0-9a-f]{64}$
        new_public_key:
          type: string
          contentEncoding: base64
          maxLength: 128
        continuity_signature:
          type: string
          contentEncoding: base64
          maxLength: 128
    ClaimChallengeRequest:
      type: object
      additionalProperties: false
      required:
        - device_id
        - batch_commitment
      properties:
        device_id:
          type: string
          format: uuid
        batch_commitment:
          type: string
          pattern: ^[0-9a-f]{64}$
    ClaimChallenge:
      type: object
      additionalProperties: false
      required:
        - challenge_id
        - device_id
        - nonce
        - batch_commitment
        - expires_at
      properties:
        challenge_id:
          type: string
          pattern: ^[0-9a-f]{64}$
        device_id:
          type: string
          format: uuid
        nonce:
          type: string
          contentEncoding: base64
          maxLength: 64
        batch_commitment:
          type: string
          pattern: ^[0-9a-f]{64}$
        expires_at:
          type: string
          format: date-time
    ClaimRejection:
      type: object
      additionalProperties: false
      required:
        - claim_index
        - reason_code
        - retryable
      properties:
        claim_index:
          type: integer
          minimum: 0
          maximum: 255
        reason_code:
          type: string
          minLength: 1
          maxLength: 64
        retryable:
          type: boolean
    ClaimBatchResult:
      type: object
      additionalProperties: false
      required:
        - batch_id
        - state
        - accepted_claim_ids
        - rejections
        - checkpoint_receipt
      properties:
        batch_id:
          type: string
          format: uuid
        state:
          enum:
            - accepted
            - rejected
        accepted_claim_ids:
          type: array
          maxItems: 256
          items:
            type: string
            format: uuid
        rejections:
          type: array
          maxItems: 256
          items:
            $ref: '#/components/schemas/ClaimRejection'
        checkpoint_receipt:
          type:
            - string
            - 'null'
          contentEncoding: base64
          maxLength: 4096
    ClaimRecord:
      type: object
      additionalProperties: false
      required:
        - claim_id
        - device_id
        - sequence
        - state
        - payload_digest
        - appraisal_id
        - accepted_at
        - evidence_class
      properties:
        claim_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        sequence:
          type: integer
          minimum: 0
        state:
          enum:
            - accepted
            - corrected
            - retracted
            - quarantined
        payload_digest:
          type: string
          pattern: ^[0-9a-f]{64}$
        appraisal_id:
          type: string
          format: uuid
          description: >-
            The verifier appraisal that decided this claim. It is retrieved
            through operationId `getAppraisal`, which answers with
            `AppraisalSummary` — the self-only projection of
            `packages/schemas/appraisal-result-v1.schema.json`. The identifier
            is classified `self` in
            `packages/schemas/disclosure-projection-v1.json` because the
            appraisal it names is integrity-private, so it never reaches a
            viewer who is not the submitter of this claim.
        accepted_at:
          type: string
          format: date-time
        evidence_class:
          enum:
            - hardened
            - standard
            - imported
          description: The awarded public evidence state from packages/schemas/evidence-profile-policy-v1.json. The server verifier assigns it; a client field requesting one is ignored under the policy's client-requested-public-state rule. Under ADR-020 the class is a weight on Credited Token Burn rather than a badge, and under D-100 no provider offers an individual-account attestation path, so the class assesses the quality of a self-report and is not a confirmation from any provider.
    AppraisalSummary:
      type: object
      additionalProperties: false
      description: >-
        The self-only projection of `VerifierAppraisalResult`
        (`packages/schemas/appraisal-result-v1.schema.json`). It carries every
        field of that record except `schema_version`, which is a wire concern of
        the stored record rather than of this document, and except the two the
        subject is not told: `evaluated.anomaly_disposition` under D-381 and
        `policy.implementation_sha256` as data that is not the participant's
        own. The record's `public_state` crosses the boundary as
        `evidence_class`, which is the one evidence vocabulary D-143 admits to
        the API.
      required:
        - appraisal_id
        - claim_id
        - canonical_claim_sha256
        - evidence_bundle_sha256
        - policy
        - authority
        - client_influence
        - attestation
        - acceptance_outcome
        - dimensions
        - evaluated
        - awarded_profile_id
        - evidence_class
        - ranking_eligibility
        - reason_codes
        - validity
        - supersession
      properties:
        appraisal_id:
          type: string
          format: uuid
        claim_id:
          type: string
          format: uuid
        canonical_claim_sha256:
          description: The digest of the exact signed claim bytes this appraisal evaluated.
          type: string
          pattern: ^[0-9a-f]{64}$
        evidence_bundle_sha256:
          description: Null when the device retained no bundle, which is an input to the capture dimension rather than a neutral absence.
          type:
            - string
            - 'null'
          pattern: ^[0-9a-f]{64}$
        policy:
          type: object
          additionalProperties: false
          description: 'The published policy bundle the appraisal was decided under. `implementation_sha256` is withheld: the verifier build digest is not the participant''s personal data and no appeal needs it.'
          required:
            - policy_bundle_id
            - content_sha256
          properties:
            policy_bundle_id:
              type: string
              maxLength: 128
              pattern: ^[a-z0-9]+(?:[.-][a-z0-9]+)*$
            content_sha256:
              type: string
              pattern: ^[0-9a-f]{64}$
        authority:
          description: Public evidence status is assigned by the server verifier and never selected by the client.
          enum:
            - server-verifier
        client_influence:
          enum:
            - none
        attestation:
          type: object
          additionalProperties: false
          description: D-100. The appraisal assesses how good a self-report is. No surface may present it as a confirmation from a provider, because no provider offers an individual-account attestation path.
          required:
            - class
            - basis
            - assesses
          properties:
            class:
              enum:
                - none
            basis:
              enum:
                - self-reported-at-source
            assesses:
              enum:
                - self-report-quality
        acceptance_outcome:
          enum:
            - accepted
            - accepted-with-downgrade
            - accepted-private-analytics
            - idempotent-replay
            - quarantined
            - rejected
            - superseded
            - retracted
        dimensions:
          type: object
          additionalProperties: false
          description: The seven independent dimensions. A stronger value in one never compensates for a failed mandatory requirement in another. The subject already reads the derived weights on `SelfRankEntry`, so disclosing the dimensions to the subject discloses strictly less than what they hold already.
          required:
            - source_class
            - capture_class
            - accounting_class
            - device_key_class
            - continuity_class
            - environment_class
            - freshness_class
          properties:
            source_class:
              enum:
                - E1-S
                - E1-R
                - E2
                - E3
                - E4
                - E5
            capture_class:
              enum:
                - certified-structured
                - certified-gateway
                - certified-reconstruction
                - uncertified
            accounting_class:
              enum:
                - authoritative-profile
                - exact-reconstruction
                - approximate
                - contradictory
            device_key_class:
              enum:
                - K1
                - K2
                - K3
                - K4
                - K5
                - KU
            continuity_class:
              enum:
                - C0
                - C1
                - C2
                - C3
                - C4
            environment_class:
              enum:
                - A0
                - A1
                - A2
                - A3
                - A4
            freshness_class:
              enum:
                - anchored
                - bounded-delayed
                - unbounded
                - contradictory
        evaluated:
          type: object
          additionalProperties: false
          description: 'The rule set the dimensions were read under, which is what an appeal argues against. `anomaly_disposition` is withheld: its `under-review` and `shadow-only` values are the statement that an integrity case is open, and D-381 keeps that from the participant.'
          required:
            - certification_bundle_sha256
            - certification_state
            - deterministic_rule_bundle_id
            - accounting_profile_id
            - observer_equivalence_rule_id
          properties:
            certification_bundle_sha256:
              type:
                - string
                - 'null'
              pattern: ^[0-9a-f]{64}$
            certification_state:
              description: 'The lifecycle state of the tuple this claim was appraised under, from the `source-certification` machine. The digest above says which certification was read; this says whether it was still active when it was read, and a claim capped at private analytics because its tuple was suspended or expired is entitled to know that rather than to infer it. `uncertified` covers a capture bound to no certification at all.'
              enum:
                - uncertified
                - candidate
                - testing
                - active
                - degraded
                - suspended
                - expired
                - superseded
                - retired
            deterministic_rule_bundle_id:
              type: string
              maxLength: 128
              pattern: ^[a-z0-9]+(?:[.-][a-z0-9]+)*$
            accounting_profile_id:
              type: string
              maxLength: 128
              pattern: ^[a-z0-9]+(?:[.-][a-z0-9]+)*$
            observer_equivalence_rule_id:
              type: string
              maxLength: 128
              pattern: ^[a-z0-9]+(?:[.-][a-z0-9]+)*$
        awarded_profile_id:
          type:
            - string
            - 'null'
          enum:
            - hardened-source-bound-v1
            - standard-competitive-v1
            - imported-v1
            - null
        evidence_class:
          description: The record's `public_state` under the one API vocabulary D-143 fixes. Null when no profile was awarded. A client never selects it.
          type:
            - string
            - 'null'
          enum:
            - hardened
            - standard
            - imported
            - null
        ranking_eligibility:
          enum:
            - competitive
            - competitive-pending-finalization
            - private-analytics
            - quarantined
            - excluded
            - retracted
        reason_codes:
          description: Codes from `packages/schemas/reason-codes-v1.json`. Their `appealability` is what tells the subject whether this outcome can be appealed.
          type: array
          uniqueItems: true
          maxItems: 64
          items:
            type: string
            maxLength: 128
            pattern: ^[a-z0-9]+(?:[.-][a-z0-9]+)*$
        validity:
          type: object
          additionalProperties: false
          required:
            - effective_from
            - effective_until
          properties:
            effective_from:
              type: string
              format: date-time
            effective_until:
              type:
                - string
                - 'null'
              format: date-time
        supersession:
          type: object
          additionalProperties: false
          description: Appraisals are immutable and corrections are append-only, so a re-evaluation is a new appraisal that supersedes this one rather than an edit to it.
          required:
            - supersedes_appraisal_id
            - superseded_by_appraisal_id
            - re_evaluation_trigger
          properties:
            supersedes_appraisal_id:
              type:
                - string
                - 'null'
              format: uuid
            superseded_by_appraisal_id:
              type:
                - string
                - 'null'
              format: uuid
            re_evaluation_trigger:
              type:
                - string
                - 'null'
              enum:
                - policy-revision
                - implementation-revision
                - certification-change
                - correction-record
                - appeal-decision
                - operator-review
                - null
    RankEntry:
      type: object
      additionalProperties: false
      description: 'One standing on a leaderboard page. The field named score was removed under D-144: ADR-020 bans it as a name because it is the word that lets the claimed and credited figures merge.'
      required:
        - account_id
        - handle
        - display_name
        - avatar_id
        - evidence_class
        - credited_token_burn
        - position
        - previous_position
        - rank_movement
        - availability
        - ranking_view_id
        - snapshot_id
        - revision
      properties:
        account_id:
          type: string
          format: uuid
        handle:
          type: string
          minLength: 3
          maxLength: 30
        display_name:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 60
          description: Participant-chosen display name, distinct from the immutable handle. Null when the participant set none, in which case a client renders the handle.
        avatar_id:
          type: integer
          minimum: 0
          maximum: 8
          description: Index into the repository-owned avatar library in assets/ui/fixtures. The product accepts no uploaded image, so no participant-supplied media crosses the boundary.
        evidence_class:
          enum:
            - hardened
            - standard
          description: 'The awarded public evidence state from packages/schemas/evidence-profile-policy-v1.json. The server verifier assigns it; a client field requesting one is ignored under the policy''s client-requested-public-state rule. Under ADR-020 the class is a weight on Credited Token Burn rather than a badge, and under D-100 no provider offers an individual-account attestation path, so the class assesses the quality of a self-report and is not a confirmation from any provider. `imported` is absent on a ranking entry and only on a ranking entry: historical imports never enter active competition, so an imported record produces no entry. `ranking_entries.evidence_class` and ranking-generation-v1.schema.json both refused it already, which left this schema as the one artifact in the repository saying an import could be ranked. A profile still carries it, because a participant whose only records are imports has an evidence class and no standing.'
        credited_token_burn:
          type: integer
          minimum: 0
          description: 'Credited Token Burn: Token Burn multiplied by the server-assigned confidence weight, floored, integer throughout. This is the quantity rank() orders. Token Burn itself is absent from every public surface under D-144, because publishing both quantities lets any observer recover the weight by division and, since the evidence class is already public, recover the trust factor and therefore a sanction D-084 keeps private.'
        position:
          type: integer
          minimum: 1
        previous_position:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Position in the superseded generation of this ranking view, or null when this entry is new to the board.
        rank_movement:
          type: integer
          minimum: -1000000
          maximum: 1000000
          description: Positions gained since the previous generation of this ranking view. Negative is a fall, zero is unchanged.
        availability:
          enum:
            - online
            - idle
            - offline
          description: Server-derived from qualifying device activity. A participant whose presence visibility excludes this viewer reads offline, which is the same value an inactive participant reads.
        top_model_alias:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 64
        ranking_view_id:
          type: string
          pattern: ^[0-9a-f]{64}$
        generation:
          type: integer
          minimum: 0
          description: 'The sealed generation this entry belongs to. Every entry key in planning-schema.sql includes it — `ranking_entries` is keyed `(ranking_view_id, generation, position)` and unique on `(ranking_view_id, generation, erasure_domain_id)` — and the API projection of an entry did not carry it, so a client holding a position could not say which generation the position indexed and two generations of one view rendered as one series.'
        snapshot_id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 0
    LeaderboardPage:
      type: object
      additionalProperties: false
      required:
        - items
        - cursor
        - ranking_view_id
        - generation
        - snapshot_id
        - revision
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/RankEntry'
        cursor:
          type:
            - string
            - 'null'
          maxLength: 2048
          description: 'The opaque forward cursor for the next page, or null on the last page. Its record shape is packages/schemas/ranking-cursor-v1.schema.json: it binds the viewer it was issued to, the generation it anchors in, the authorization revision that held at issue and an expiry, and conformance/planning/ranking-cursor-vectors-v1.json states each way a presentation of it is refused. A client never constructs one and never parses one.'
        ranking_view_id:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: The definition-and-audience pair this page was rendered for. A page that names only a snapshot cannot be checked against the audience the caller was authorized for.
