name: Feature request
description: Propose a product or engineering capability
title: '[feature]: '
labels: ['enhancement', 'triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: 'Describe the user or engineering problem, not only a preferred solution.'
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and integrity impact
      description: 'State which data boundaries, evidence levels, or abuse cases are affected.'
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
