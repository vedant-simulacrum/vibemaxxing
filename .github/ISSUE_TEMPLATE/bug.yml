name: Bug report
description: Report a reproducible defect
title: '[bug]: '
labels: ['bug', 'triage']
body:
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: 'Who is affected and how?'
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: 'Provide minimal deterministic steps and fixture data.'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk area
      options: [UI, Backend, VibeProof, Privacy, Security, Integrity, Operations]
    validations:
      required: true
