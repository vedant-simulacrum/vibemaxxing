name: Bootstrap repository import

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap-import/**'
      - '.github/workflows/bootstrap-import.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait until all source parts exist
        id: parts
        shell: bash
        run: |
          if [[ -f bootstrap-import/part-00.b64 && -f bootstrap-import/part-01.b64 && -f bootstrap-import/part-02.b64 ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Reconstruct authoritative repository
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap-import/part-*.b64 | base64 --decode > /tmp/vibemaxxing-source.tar.gz
          tar -xzf /tmp/vibemaxxing-source.tar.gz -C .
          rm -rf bootstrap-import .github/workflows/bootstrap-import.yml
          git config user.name 'vibemaxxing-bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Import authoritative VibeMaxxing project context'
          git push origin HEAD:main
