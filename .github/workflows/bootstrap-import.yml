name: Bootstrap repository import

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap-import/clean-part-*.b64'
      - '.github/workflows/bootstrap-import.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and validate deterministic authoritative archive
        shell: bash
        run: |
          set -euo pipefail
          expected_sha='e6c53b379db243f31eef0ac218b1655b220d29e12d1342fc6d3bc3813f212df2'
          count=$(find bootstrap-import -maxdepth 1 -name 'clean-part-*.b64' | wc -l | tr -d ' ')
          test "$count" = '10'
          test -f bootstrap-import/clean-part-00.b64
          test -f bootstrap-import/clean-part-09.b64

          cat bootstrap-import/clean-part-*.b64 \
            | tr -d '\n' \
            | base64 --decode \
            > /tmp/vibemaxxing-source.tar.gz

          actual_sha=$(sha256sum /tmp/vibemaxxing-source.tar.gz | awk '{print $1}')
          test "$actual_sha" = "$expected_sha"
          gzip -t /tmp/vibemaxxing-source.tar.gz
          mkdir -p /tmp/vibemaxxing-source
          tar -xzf /tmp/vibemaxxing-source.tar.gz -C /tmp/vibemaxxing-source

          for required in \
            README.md \
            START_HERE_PROMPT.md \
            PROJECT_CONTEXT.md \
            PROJECT_INSTRUCTIONS.md \
            CURRENT_STATUS.md \
            IMPLEMENTATION_ROADMAP.md \
            RESEARCH_AND_EVIDENCE_BACKLOG.md \
            AGENTS.md \
            MANIFEST_FILES.txt \
            .github/workflows/ci.yml \
            .github/workflows/security.yml \
            .github/workflows/release.yml \
            docs/product/PRODUCT_SPEC.md \
            docs/privacy/PRIVACY_CONTRACT.md \
            docs/architecture/ARCHITECTURE.md \
            docs/implementation/BUILD_PLAN.md \
            docs/evals/EVAL_SYSTEM.md \
            evals/suites/suites.yaml \
            scripts/ci/repository_policy.py \
            scripts/ci/run_evals.py; do
            test -f "/tmp/vibemaxxing-source/$required"
          done

          expected=$(grep -cve '^[[:space:]]*$' /tmp/vibemaxxing-source/MANIFEST_FILES.txt)
          actual=$(find /tmp/vibemaxxing-source -type f | wc -l | tr -d ' ')
          test "$actual" -ge "$expected"
          test "$expected" -ge 90
          test ! -e /tmp/vibemaxxing-source/bootstrap-import

      - name: Replace temporary repository with authoritative tree
        shell: bash
        run: |
          set -euo pipefail

          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            -exec rm -rf {} +

          find .github -mindepth 1 -maxdepth 1 \
            ! -name workflows \
            -exec rm -rf {} +

          find .github/workflows -mindepth 1 -maxdepth 1 \
            ! -name bootstrap-import.yml \
            -exec rm -rf {} +

          cp -a /tmp/vibemaxxing-source/. .
          rm -rf bootstrap-import .github/workflows/bootstrap-import.yml

          git config user.name 'vibemaxxing-bootstrap'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Replace broken bootstrap with authoritative VibeMaxxing tree'
          git push origin HEAD:main
