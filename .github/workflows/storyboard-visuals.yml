# Prototype-only visual validation under ADR-014 / D-069.
# This workflow is not product CI, release evidence, security evidence, deployment
# automation, accessibility completion, or authorization to implement the product.
name: Prototype storyboard visuals

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/ui/**"
      - "assets/**"
      - "scripts/ui/**"
      - "docs/style-guide/**"
      - ".github/workflows/storyboard-visuals.yml"

permissions:
  contents: read

concurrency:
  group: prototype-storyboards-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VIBEMAXXING_ARTIFACT_MATURITY: runnable-prototype
  VIBEMAXXING_FIXTURE_POLICY: synthetic-only
  CI: "true"

jobs:
  capture:
    name: Build, compare, and capture synthetic Storybook fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/ui/package-lock.json
      - name: Install locked UI dependencies
        run: npm ci
      - name: Validate design system and governed assets
        working-directory: .
        run: node scripts/ui/check-ui-system.mjs
      - name: Install temporary screenshot runtime
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium for isolated capture
        run: npx playwright install --with-deps chromium
      - name: Run prototype UI tests
        run: npm run test
      - name: Build static Storybook prototype
        run: npm run storybook:build
      - name: Serve Storybook on loopback only
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 -d storybook-static > /tmp/vibemaxxing-storybook.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/iframe.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/vibemaxxing-storybook.log
          exit 1
      - name: Capture locked synthetic storyboards at all governed breakpoints
        run: node scripts/capture-product-storyboards.mjs storybook-captures
      - name: Compare desktop captures with governed baselines
        run: node scripts/compare-product-storyboards.mjs storybook-captures storybook-diffs
      - name: Upload prototype visual-review artifacts and diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prototype-storyboards-responsive-and-diffs
          path: |
            packages/ui/storybook-captures/*.png
            packages/ui/storybook-diffs/*
          if-no-files-found: error
          retention-days: 30
