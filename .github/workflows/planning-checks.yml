name: Planning checks

# Path filters were removed under PF-056. They exempted apps/, crates/, Cargo.toml,
# and .github/workflows/ci.yml from every check, so a pull request touching only
# product code triggered nothing at all.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Deliberately a second job rather than more steps in planning-checks.
  #
  # Measuring costs about three and a half minutes: it re-runs the whole unit suite
  # under coverage.py and builds the Rust workspace instrumented from cold. The
  # planning-checks job is already about four minutes since the node lane started
  # building the npm workspaces, and appending this to it would take the required
  # check past seven. As a separate job the two run concurrently, so the wall-clock
  # time a pull request waits does not grow; what grows is billed runner minutes,
  # roughly doubling them for this workflow. That is the trade, stated rather than
  # absorbed.
  #
  # It runs per pull request rather than on main only, because a coverage regression
  # found after merge is found by whoever hits it next.
  measured-coverage:
    # This job is cheap: it completes in about two and a half minutes, and the
    # instrumented Rust build is not the cost. Two runs were cancelled at exactly
    # 15m02s and 15m04s against completions of 1m47s, 2m38s and 2m47s — a bimodal
    # split that is runner contention starving the job, not work it is doing. An
    # earlier commit on this branch moved it off the pull-request path blaming the
    # Rust build. That reason was wrong; the 15-minute budget was the defect, so
    # the job runs on pull requests again and both jobs get room to finish.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # llvm-profdata and llvm-cov ship in this rustup component. Nothing is installed
      # from crates.io to measure Rust: cargo-llvm-cov produces the identical number
      # and would be one more pinned third-party binary compiled on every run.
      - name: Add the LLVM coverage tools to the pinned toolchain
        run: rustup component add llvm-tools-preview
      - name: Install pinned planning validators
        run: python3 -m pip install --disable-pip-version-check -r requirements-planning.txt
      # No --allow-unmeasured. Every toolchain this needs is present on the runner, so
      # a surface reporting unmeasured here is a defect rather than a local absence,
      # and an unmeasured surface is an absence of evidence rather than a pass.
      - name: Measure coverage against the recorded ceiling
        run: python3 scripts/ci/measure_coverage.py
      # Measuring must not leave anything behind. An instrumented build that drops
      # default_*.profraw into the tree would make every later `git status` lie.
      - name: The measurement left the working tree clean
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  planning-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vibemaxxing_planning
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vibemaxxing_planning"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PLANNING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vibemaxxing_planning
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Full history, because `validate_repair_task_binding.py` resolves the
          # commit each `closure_evidence` entry is pinned to. At the default depth
          # of 1 no historical commit exists, so the validator reports every entry
          # as unresolved — honest, and useless exactly where it is enforced. A
          # check that only runs on the author's laptop is not a check.
          fetch-depth: 0
      # The verification matrix now builds the npm workspaces, so node has to be
      # pinned here rather than inherited from whatever the runner image ships.
      # This is what stops `apps/web` regressing to a state where it does not
      # compile at all — which is where it sat, unnoticed, until issue 52.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install pinned planning validators
        run: python3 -m pip install --disable-pip-version-check -r requirements-planning.txt
      - name: Repository doctor
        run: python3 scripts/repository/doctor.py
      - name: Validate P-1140F authority, maturity, and review state
        run: python3 scripts/repository/validate_p1140f_authority.py
      - name: Validate schemas, registries, examples, protocols, API, and SQL
        run: python3 scripts/repository/validate_planning_artifacts.py
      - name: Validate provisional T20 candidate artifacts
        run: python3 scripts/repository/validate_t20_contract.py
      - name: Validate P-1140E cross-contract handoff
        run: python3 scripts/repository/validate_p1140e_contracts.py
      # PF-001. Every artifact the authority record calls a prototype says so in
      # its own source, and lists the same incompatibilities and prohibitions the
      # record does. The criterion this replaces was a grep for unmarked mentions,
      # which a file saying nothing at all satisfied.
      - name: Validate that quarantined artifacts carry their notice
        run: python3 scripts/repository/validate_artifact_quarantine.py
      # Binds each P-1140F step to the units and findings that compose it, so a
      # step's Status: is derived rather than asserted. Before this, the catalog
      # named zero units and the work breakdown named zero repair tasks, and a
      # step could record complete-planning with six units not-started.
      - name: Validate the P-1140F step, unit and finding binding
        run: python3 scripts/repository/validate_repair_task_binding.py
      - name: Validate current launch API, SQL, and repaired authority coverage
        run: python3 scripts/repository/validate_planning_coverage.py
      - name: Validate state vocabularies across API, SQL, and the machine registry
        run: python3 scripts/repository/validate_state_vocabularies.py
      # Fails on a missing required field, an unresolvable dependency, a cycle, a
      # status the tree contradicts, a SQL table no unit owns, or a stale derived
      # block. A `not-started` unit whose artifact now exists fails here rather
      # than staying not-started until somebody notices.
      - name: Validate work-unit fields, status and table ownership
        run: python3 scripts/repository/validate_work_unit_status.py
      # Every load-scenario rate names the policy key it was derived from, and this
      # resolves them. A scenario whose rate outlives the limit it came from is a
      # scenario that will assert something untrue the first time anybody runs it.
      - name: Resolve every load scenario against the policy defaults
        run: python3 scripts/repository/validate_load_scenarios.py
      - name: Validate the evaluation registry
        run: python3 scripts/ci/run_evals.py --validate-registry
      # The dangle set is empty and tests/ci/test_cross_references.py pins it there, so
      # a new dangling reference fails this step rather than joining a tolerated list.
      - name: Resolve every repository cross-reference
        run: python3 scripts/repository/validate_cross_references.py
      - name: Run the validator unit tests
        run: python3 -m unittest discover -s tests
      # Green at HEAD, and green only because the holes are written down. The node lane
      # reports `uncovered` rather than `not_applicable` — apps/web, packages/ui and
      # scripts/brand are npm workspaces with lockfiles that no workflow has ever built,
      # and apps/web has never built at all (issue 52) — and the eval lane reports
      # `partial`. Both outcomes are recorded in scripts/ci/coverage-baseline-v1.json,
      # so this step fails when coverage gets worse than the record, not because it is
      # already imperfect. Do not silence a new hole by editing that file without a
      # reason a reviewer can read.
      - name: Verification matrix
        run: python3 scripts/ci/verify_repository.py
      - name: Validate deterministic stable work-unit generation
        run: |
          python3 scripts/repository/generate_issue_plan.py --output /tmp/vibemaxxing-issue-plan.json
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          data = json.loads(Path('/tmp/vibemaxxing-issue-plan.json').read_text())
          record = json.loads(Path('conformance/p1140f/gate-authorization-v1.json').read_text())
          states = {gate['gate']: gate['state'] for gate in record['gates']}
          issues = data['issues']
          keys = [issue['key'] for issue in issues]
          by_key = {issue['key']: issue for issue in issues}
          assert data['schema_version'] == 3
          assert data['issue_count'] == len(issues)
          assert len(keys) == len(set(keys))
          assert all(re.fullmatch(r'[A-Z][A-Z0-9]*-\d{3}', key) for key in keys)
          assert {'PF-001', 'PF-036', 'F-001', 'P-008', 'N-016'} <= set(keys)
          # PF-037. These once asserted the literals the generator hardcoded, so the
          # pair could only agree with each other and never with the gate record. Both
          # now read that record, and a gate the owner moves moves them together.
          assert by_key['PF-001']['phase_gate'] == 'P-1140F'
          assert by_key['F-001']['phase_gate'] == 'P-1104'
          assert by_key['PF-001']['phase_gate_state'] == states['P-1140F']
          assert by_key['F-001']['phase_gate_state'] == states['P-1104']
          assert all(('blocked' in i['labels']) == i['blocked'] for i in issues)
          required = {'files', 'acceptance', 'depends', 'est', 'status'}
          assert all(required <= issue.keys() for issue in issues)
          assert all(issue['acceptance'] and issue['est'] and issue['status'] for issue in issues)
          assert not any(key.startswith('IMP-') for key in keys)
          print(f'issue plan: pass ({len(keys)} stable work units)')
          PY

# This workflow validates planning artifacts, and — since PF-056 — also runs the
# verification matrix, which exercises the Rust and Go lanes when those toolchains are
# present and reports them as not_applicable when they are not. Neither language was
# reached by any workflow before this. It still does not deploy, release, or sign
# anything, and a green run remains evidence of structural consistency only.
#
# A lane that executed nothing is no longer reported the same way as one that passed.
# The matrix separates not_applicable (nothing exists to run) from uncovered (something
# exists and nothing runs it), and the eval registry is pinned against a recorded status
# ceiling so a suite cannot be downgraded to not_applicable without a reviewable edit.
