name: Planning checks

# Path filters were removed under PF-056. They exempted apps/, crates/, Cargo.toml,
# and .github/workflows/ci.yml from every check, so a pull request touching only
# product code triggered nothing at all.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  planning-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vibemaxxing_planning
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vibemaxxing_planning"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PLANNING_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vibemaxxing_planning
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned planning validators
        run: python3 -m pip install --disable-pip-version-check -r requirements-planning.txt
      - name: Repository doctor
        run: python3 scripts/repository/doctor.py
      - name: Validate P-1140F authority, maturity, and review state
        run: python3 scripts/repository/validate_p1140f_authority.py
      - name: Validate schemas, registries, examples, protocols, API, and SQL
        run: python3 scripts/repository/validate_planning_artifacts.py
      - name: Validate provisional T20 candidate artifacts
        run: python3 scripts/repository/validate_t20_contract.py
      - name: Validate P-1140E cross-contract handoff
        run: python3 scripts/repository/validate_p1140e_contracts.py
      - name: Validate current launch API, SQL, and repaired authority coverage
        run: python3 scripts/repository/validate_planning_coverage.py
      - name: Validate state vocabularies across API, SQL, and the machine registry
        run: python3 scripts/repository/validate_state_vocabularies.py
      # Fails on a missing required field, an unresolvable dependency, a cycle, a
      # status the tree contradicts, a SQL table no unit owns, or a stale derived
      # block. A `not-started` unit whose artifact now exists fails here rather
      # than staying not-started until somebody notices.
      - name: Validate work-unit fields, status and table ownership
        run: python3 scripts/repository/validate_work_unit_status.py
      - name: Validate the evaluation registry
        run: python3 scripts/ci/run_evals.py --validate-registry
      # The dangle set is empty and tests/ci/test_cross_references.py pins it there, so
      # a new dangling reference fails this step rather than joining a tolerated list.
      - name: Resolve every repository cross-reference
        run: python3 scripts/repository/validate_cross_references.py
      - name: Run the validator unit tests
        run: python3 -m unittest discover -s tests
      # Green at HEAD, and green only because the holes are written down. The node lane
      # reports `uncovered` rather than `not_applicable` — apps/web, packages/ui and
      # scripts/brand are npm workspaces with lockfiles that no workflow has ever built,
      # and apps/web has never built at all (issue 52) — and the eval lane reports
      # `partial`. Both outcomes are recorded in scripts/ci/coverage-baseline-v1.json,
      # so this step fails when coverage gets worse than the record, not because it is
      # already imperfect. Do not silence a new hole by editing that file without a
      # reason a reviewer can read.
      - name: Verification matrix
        run: python3 scripts/ci/verify_repository.py
      - name: Validate deterministic stable work-unit generation
        run: |
          python3 scripts/repository/generate_issue_plan.py --output /tmp/vibemaxxing-issue-plan.json
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          data = json.loads(Path('/tmp/vibemaxxing-issue-plan.json').read_text())
          issues = data['issues']
          keys = [issue['key'] for issue in issues]
          by_key = {issue['key']: issue for issue in issues}
          assert data['schema_version'] == 2
          assert data['issue_count'] == len(issues)
          assert len(keys) == len(set(keys))
          assert all(re.fullmatch(r'[A-Z][A-Z0-9]*-\d{3}', key) for key in keys)
          assert {'PF-001', 'PF-036', 'F-001', 'P-008', 'N-016'} <= set(keys)
          assert by_key['PF-001']['phase_gate'] == 'P-1140F-planning-repair'
          assert by_key['F-001']['phase_gate'] == 'P-1104-explicit-implementation-approval'
          assert not any(key.startswith('IMP-') for key in keys)
          print(f'issue plan: pass ({len(keys)} stable work units)')
          PY

# This workflow validates planning artifacts, and — since PF-056 — also runs the
# verification matrix, which exercises the Rust and Go lanes when those toolchains are
# present and reports them as not_applicable when they are not. Neither language was
# reached by any workflow before this. It still does not deploy, release, or sign
# anything, and a green run remains evidence of structural consistency only.
#
# A lane that executed nothing is no longer reported the same way as one that passed.
# The matrix separates not_applicable (nothing exists to run) from uncovered (something
# exists and nothing runs it), and the eval registry is pinned against a recorded status
# ceiling so a suite cannot be downgraded to not_applicable without a reviewable edit.
