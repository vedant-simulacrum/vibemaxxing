name: Security checks (manual during planning)

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Planning-phase notice
        run: |
          echo 'Automated security scanning is disabled during the planning phase.'
          echo 'Re-enable CodeQL, dependency review, secret scanning, and language audits before implementation begins.'

# This workflow is intentionally manual-only while the repository is in planning mode.
