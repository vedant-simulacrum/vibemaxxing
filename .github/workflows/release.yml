name: Release evidence (manual during planning)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planning-notice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          echo 'Release automation is disabled during planning.'
          echo 'Restore SBOM, provenance, signing, attestation, packaging, and consumer verification before release preparation.'

# No tag-triggered release work runs during the planning phase.
