name: Planning checks (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planning-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Repository policy
        run: python3 scripts/ci/repository_policy.py
      - name: Validate JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text())
          PY

# During the planning phase this workflow runs only when manually requested.
# Automated build, eval, security, dependency, and release checks are intentionally disabled.
